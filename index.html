<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Холодильник — Преврати хаос в порядок!</title>
    <style>
        /* Встраиваем базовые стили приложения прямо в файл, чтобы не зависеть от серверов */
        body { background-color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; color: #334155; margin: 0; padding: 0; }
        .app-container { max-width: 28rem; margin: 0 auto; background-color: #ffffff; min-h: 100vh; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); flex-direction: column; display: flex; position: relative; min-height: 100vh; }
        header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
        .header-top { display: flex; justify-content: space-between; items-center: center; align-items: center; margin-bottom: 0.75rem; }
        h1 { font-size: 1.25rem; font-weight: 700; color: #4f46e5; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
        .history-btns { display: flex; gap: 0.5rem; }
        .btn-action { padding: 0.5rem; border-radius: 9999px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-action:hover { background-color: #f1f5f9; }
        .btn-action:disabled { opacity: 0.3; cursor: not-allowed; }
        .filter-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; font-size: 0.875rem; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .tab-btn { px-3; padding: 0.375rem 0.75rem; border-radius: 9999px; border: none; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color 0.2s; }
        .tab-active { background-color: #4f46e5; color: #ffffff; }
        .tab-inactive { background-color: #f1f5f9; color: #475569; }
        .tab-inactive:hover { background-color: #e2e8f0; }
        .tab-amber { background-color: #f59e0b; color: #ffffff; }
        main { flex-grow: 1; padding: 1rem; overflow-y: auto; padding-bottom: 6rem; }
        .shelf-section { margin-bottom: 1.5rem; }
        .shelf-title { font-size: 0.75rem; font-weight: 700; color: #94a3b8; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; padding-left: 0.25rem; }
        .shelf-border { border-bottom: 8px solid #cbd5e1; min-height: 96px; background-color: rgba(248,250,252,0.6); border-radius: 0.75rem 0.75rem 0 0; padding: 0.75rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
        .shelf-hover { background-color: rgba(79, 70, 229, 0.15) !important; border-color: #4f46e5 !important; }
        .list-grid { display: flex; flex-wrap: wrap; gap: 1rem; padding: 0.5rem; justify-content: flex-start; }
        .product-card { position: relative; display: flex; flex-direction: column; align-items: center; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.5rem; cursor: pointer; shadow: 0 1px 2px 0 rgba(0,0,0,0.05); width: 4rem; transition: all 0.2s; box-sizing: border-box; }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .product-expiring { background-color: #fff1f2; border-color: #fca5a5; }
        .product-emoji { font-size: 1.875rem; margin-bottom: 0.25rem; user-select: none; }
        .product-name { font-size: 10px; text-align: center; font-weight: 500; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #334155; }
        .product-badge { position: absolute; top: -0.25rem; right: -0.25rem; background-color: #4f46e5; color: #ffffff; font-size: 9px; font-weight: 700; px: 1.5; padding: 0.125rem 0.375rem; border-radius: 9999px; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
        .product-days { font-size: 8px; margin-top: 0.125rem; font-weight: 600; color: #94a3b8; }
        .text-rose { color: #e11d48; font-weight: 700; }
        .trash-overlay { position: absolute; id: 0; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(239,68,68,0.1); border-radius: 0.75rem; opacity: 0; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
        .product-card:hover .trash-overlay { opacity: 1; }
        .empty-shelf { font-size: 0.75rem; font-style: italic; color: #cbd5e1; margin: auto; padding: 1rem 0; }
        /* Стили для Книги рецептов и всплывающих окон */
        .recipe-card { padding: 1rem; border-radius: 1rem; border: 1px solid #e2e8f0; background-color: #ffffff; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); margin-bottom: 1rem; }
        .recipe-cookable { border-color: #a7f3d0; background-color: rgba(240, 253, 250, 0.5); }
        .recipe-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .recipe-title { font-weight: 700; color: #1e293b; margin: 0; font-size: 1rem; }
        .recipe-subtitle { font-size: 11px; color: #94a3b8; margin: 0; }
        .badge-status { padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 10px; font-weight: 700; }
        .badge-emerald { background-color: #d1fae5; color: #065f46; }
        .badge-amber { background-color: #fef3c7; color: #92400e; }
        .ingredient-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; margin-top: 0.25rem; }
        .ing-name-ok { color: #334155; }
        .ing-name-missing { color: #e11d48; font-weight: 500; }
        .ing-status-ok { color: #059669; }
        .ing-status-missing { color: #f43f5e; }
        .btn-cook { w-full; width: 100%; bg-color: #059669; background-color: #059669; color: #ffffff; font-weight: 500; padding: 0.375rem 0; border-radius: 0.5rem; font-size: 0.75rem; border: none; cursor: pointer; margin-top: 0.75rem; transition: background-color 0.2s; }
        .btn-cook:hover { background-color: #047857; }
        .floating-btn { position: fixed; bottom: 6rem; margin-left: 23rem; z-index: 20; }
        .btn-plus { width: 3.5rem; height: 3.5rem; background-color: #4f46e5; color: #ffffff; border-radius: 9999px; border: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; }
        .btn-plus:hover { background-color: #4338ca; transform: scale(1.05); }
        .btn-plus svg { width: 2rem; height: 2rem; }
        footer { background-color: #ffffff; border-top: 1px solid #e2e8f0; padding: 0.5rem 0; display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; max-width: 28rem; box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.05); z-index: 10; box-sizing: border-box; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.125rem; background: transparent; border: none; cursor: pointer; font-size: 0.75rem; width: 33%; padding: 0.375rem 0; }
        .nav-active { color: #4f46e5; font-weight: 600; }
        .nav-inactive { color: #94a3b8; }
        .nav-inactive:hover { color: #475569; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        .modal-content { background-color: #ffffff; border-radius: 1rem; width: 100%; max-width: 24rem; padding: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); box-sizing: border-box; }
        .modal-title { font-size: 1.125rem; font-weight: 700; margin-top: 0; margin-bottom: 1rem; color: #0f172a; }
        .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; width: 100%; box-sizing: border-box; }
        .form-label { display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem; }
        .form-input, .form-select { w-full; width: 100%; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.625rem; box-sizing: border-box; font-size: 0.875rem; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #4f46e5; }
        .form-row { display: flex; flex-direction: column; gap: 0rem; width: 100%; }
        .form-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
        .btn-cancel { flex: 1; padding: 0.625rem 0; background-color: #f1f5f9; color: #475569; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem; text-align: center; }
        .btn-cancel:hover { background-color: #e2e8f0; }
        .btn-submit { flex: 1; padding: 0.625rem 0; background-color: #4f46e5; color: #ffffff; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem; text-align: center; }
        .btn-submit:hover { background-color: #4338ca; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <header>
            <div class="header-top">
                <h1 id="appTitle">
                    <!-- Заменяем SVG-иконку на встроенный смайлик, чтобы не зависеть от Lucide -->
                    <span> fridge </span> Холодильник
                </h1>
                <div class="history-btns">
                    <button id="btnUndo" onclick="undo()" class="btn-action" disabled title="Отменить последнее действие" style="padding: 6px;">
                        <!-- Красивая толстая стрелка назад (Undo) -->
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7v6h6" />
                            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
                        </svg>
                    </button>
                    <button id="btnRedo" onclick="redo()" class="btn-action" disabled title="Повторить отмененное действие" style="padding: 6px;">
                        <!-- Красивая толстая стрелка вперед (Redo) -->
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 7v6h-6" />
                            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <div id="filterBar" style="display: flex; gap: 0.5rem; align-items: center; justify-content: space-between; margin-top: 0.5rem; font-size: 0.875rem; width: 100%;">
                <!-- Компактная выпадашка для всех видов сортировки -->
                <!-- Обновленная выпадашка сортировки по вашему ТЗ -->
                <select id="sortSelect" onchange="setSortMode(this.value)" style="flex: 1; max-width: 14rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.375rem 0.5rem; font-size: 0.85rem; font-weight: 500; color: #475569; background-color: #f1f5f9; outline: none; cursor: pointer;">
                    <option value="classic">По расположению</option>
                    <option value="expiry">По сроку годности ⌛</option>
                    <option value="newest">По дате добавления 🆕</option>
                    <option value="alpha">По алфавиту 🔤</option>
                </select>

                <div style="display: flex; gap: 0.4rem; align-items: center;">
                    <!-- Наша кнопочка настроек полок, которая была тут ранее -->
                    <button onclick="openSettingsModal()" id="tab-settings" class="tab-btn tab-inactive" style="display: flex; align-items: center; justify-content: center; padding: 0.375rem 0.5rem;" title="Настройка полок">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <main id="mainContainer">
            <!-- Сюда JS добавит данные -->
        </main>

        <!-- ПЛАВАЮЩАЯ КНОПКА -->
        <div id="stickyAddBtn" class="floating-btn">
            <button onclick="openModal()" class="btn-plus">
                <span style="font-size: 2rem; line-height: 1; font-weight: 300;">+</span>
            </button>
        </div>
        <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
        <footer>
            <button id="navFridge" onclick="switchScreen('fridge')" class="nav-btn nav-active">
                <span style="font-size: 1.25rem;">🏠</span>
                <span>Холодильник</span>
            </button>
            <button id="navRecipes" onclick="switchScreen('recipes')" class="nav-btn nav-inactive">
                <span style="font-size: 1.25rem;">📖</span>
                <span>Рецепты</span>
            </button>
            <button onclick="alert('Функция совместного доступа будет добавлена на этапе подключения базы данных.')" class="nav-btn nav-inactive">
                <span style="font-size: 1.25rem;">👥</span>
                <span>Семья</span>
            </button>
        </footer>

        <!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ РЕЦЕПТА -->
        <div id="editRecipeModal" class="modal-overlay hidden">
            <div class="modal-content" style="display: flex !important; flex-direction: column !important; gap: 0.75rem !important; background-color: #ffffff; border-radius: 1rem; width: 100%; max-width: 24rem; padding: 1.5rem; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                    <h3 style="font-size: 1.125rem; font-weight: 700; margin: 0; color: #0f172a;">Редактировать рецепт</h3>
                    <span style="font-size: 1.5rem;">📖</span>
                </div>
                
                <!-- Изменение Названия -->
                <div style="display: flex !important; flex-direction: column !important; width: 100% !important; align-items: flex-start !important;">
                    <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Название блюда</label>
                    <input type="text" id="editRecName" class="form-input" style="width: 100% !important; display: block !important; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.625rem; box-sizing: border-box; font-size: 0.875rem;">
                </div>

                <!-- Контейнер для динамического списка ингредиентов -->
                <div style="display: flex !important; flex-direction: column !important; width: 100% !important; align-items: flex-start !important; margin-top: 0.25rem;">
                    <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Ингредиенты</label>
                    <div id="editRecipeIngredientsListContainer" style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-height: 10rem; overflow-y: auto; padding-right: 0.25rem; margin-bottom: 0.5rem;"></div>
                    
                    <button onclick="addIngredientRowToEditForm()" style="width: 100%; padding: 0.4rem; background-color: transparent; color: #4f46e5; border: 1px dashed #4f46e5; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600; cursor: pointer;">+ Добавить ингредиент</button>
                </div>
                
                <!-- НИЖНИЙ РЯД КНОПОК ПО СТАНДАРТУ: Корзинка слева, Отмена и Сохранить справа -->
                <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 1rem; width: 100%;">
                    <button onclick="deleteRecipeFromDetails()" style="padding: 0.5rem; background-color: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-right: 2rem; transition: opacity 0.15s;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'" title="Удалить рецепт полностью">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                    </button>
                    
                    <div style="display: flex; gap: 0.5rem; flex-grow: 1; justify-content: flex-end;">
                        <button onclick="closeEditRecipeModal()" class="btn-cancel" style="padding: 0.625rem 1.25rem; background-color: #f1f5f9; color: #475569; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.85rem;">Отмена</button>
                        <button onclick="saveEditRecipeDetails()" class="btn-submit" style="padding: 0.625rem 1.5rem; background-color: #4f46e5; color: #ffffff; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.85rem;">Сохранить</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ РЕЦЕПТА -->
        <div id="addRecipeModal" class="modal-overlay hidden">
            <div class="modal-content" style="display: flex !important; flex-direction: column !important; gap: 0.75rem !important; background-color: #ffffff; border-radius: 1rem; width: 100%; max-width: 24rem; padding: 1.5rem; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                    <h3 style="font-size: 1.125rem; font-weight: 700; margin: 0; color: #0f172a;">Создать рецепт</h3>
                    <span style="font-size: 1.25rem;">📖</span>
                </div>
                
                <!-- Название рецепта -->
                <div style="display: flex !important; flex-direction: column !important; width: 100% !important; align-items: flex-start !important;">
                    <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Название блюда</label>
                    <input type="text" id="recName" placeholder="Например: Яичница с томатами" class="form-input" autocomplete="off" style="width: 100% !important; display: block !important; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.625rem; box-sizing: border-box; font-size: 0.875rem;">
                </div>

                <!-- Контейнер для списка ингредиентов -->
                <div style="display: flex !important; flex-direction: column !important; width: 100% !important; align-items: flex-start !important; margin-top: 0.25rem;">
                    <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Ингредиенты</label>
                    <div id="recipeIngredientsListContainer" style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-height: 10rem; overflow-y: auto; padding-right: 0.25rem; margin-bottom: 0.5rem;"></div>
                    
                    <!-- Кнопка добавления строчки ингредиента -->
                    <button onclick="addIngredientRowToForm()" style="width: 100%; padding: 0.4rem; background-color: transparent; color: #4f46e5; border: 1px dashed #4f46e5; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600; cursor: pointer;">+ Добавить ингредиент</button>
                </div>
                
                <!-- Кнопки действий по нашему UX-стандарту (Отмена слева, Сохранить справа) -->
                <div class="form-actions" style="display: flex !important; flex-direction: row !important; gap: 0.75rem !important; margin-top: 0.75rem !important; width: 100% !important;">
                    <button onclick="closeAddRecipeModal()" class="btn-cancel" style="flex: 1; padding: 0.625rem 0; background-color: #f1f5f9; color: #475569; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem;">Отмена</button>
                    <button onclick="saveCustomRecipe()" class="btn-submit" style="flex: 1; padding: 0.625rem 0; background-color: #4f46e5; color: #ffffff; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem;">Сохранить</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО НАСТРОЙКИ ПОЛОК -->
        <div id="settingsShelfModal" class="modal-overlay hidden">
            <div class="modal-content" style="display: flex !important; flex-direction: column !important; gap: 0.75rem !important; background-color: #ffffff; border-radius: 1rem; width: 100%; max-width: 24rem; padding: 1.5rem; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                    <h3 style="font-size: 1.125rem; font-weight: 700; margin: 0; color: #0f172a;">Настройка полок</h3>
                    <span style="font-size: 1.25rem;">⚙️</span>
                </div>
                
                <!-- Контейнер, куда скрипт будет вставлять полки -->
                <div id="settingsModalListContainer" style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 16rem; overflow-y: auto; padding-right: 0.25rem;"></div>
                
                <!-- Кнопки управления (Закрыть во всю ширину) -->
                <div style="margin-top: 0.5rem; width: 100%;">

                    <input type="number" id="detailsDays" min="0" class="form-input" style="width: 100% !important; display: block !important; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.625rem; box-sizing: border-box; font-size: 0.875rem;">

                <!-- Кнопки управления: Иконка корзины (слева с отступом), Отмена и Сохранить (вместе справа) -->
                <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 1rem; width: 100%;">
                    <!-- Красная прозрачная иконка корзины с визуальным отступом справа (margin-right) -->
                    <button onclick="deleteAllProductFromDetails()" style="padding: 0.5rem; background-color: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-right: 1.5rem; transition: opacity 0.15s;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'" title="Удалить с полки">
                        <!-- Чистый SVG-чертеж толстой аккуратной корзины в стиле вашего приложения -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>

                    <!-- Блок кнопок Отмена и Сохранить с правой стороны -->

                        <button onclick="closeProductDetailsModal()" class="btn-cancel" style="padding: 0.625rem 1.25rem; background-color: #f1f5f9; color: #475569; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.85rem;">Отмена</button>
                        <button onclick="saveProductDetails()" class="btn-submit" style="padding: 0.625rem 1.5rem; background-color: #4f46e5; color: #ffffff; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.85rem;">Сохранить</button>
                    </div>
                </div>
            </div>

        <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ -->
        <div id="addProductModal" class="modal-overlay hidden">
            <div class="modal-content" style="display: flex !important; flex-direction: column !important; gap: 1rem !important; background-color: #ffffff; border-radius: 1rem; width: 100%; max-width: 24rem; padding: 1.5rem; box-sizing: border-box;">
                <h3 style="font-size: 1.125rem; font-weight: 700; margin-top: 0; margin-bottom: 0.25rem; color: #0f172a;">Добавить продукт</h3>
                
                <!-- СГРУППИРОВАННЫЙ РЯД: Название слева, Счетчики количества справа -->
                <div style="display: flex; gap: 0.75rem; width: 100%; align-items: flex-end;">
                    <!-- Поле Названия (занимает всё свободное место) -->
                    <div style="position: relative; display: flex !important; flex-direction: column !important; flex: 1; align-items: flex-start !important;">
                        <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Название продукта</label>
                        <input type="text" id="prodName" oninput="showSuggestions(this.value)" onclick="showSuggestions(this.value)" placeholder="Например: Milk, Сыр, Томаты" class="form-input" autocomplete="off" style="width: 100% !important; display: block !important; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.625rem; box-sizing: border-box; font-size: 0.875rem;">
                        <div id="customSuggestions" class="hidden" style="position: absolute; background: white; border: 1px solid #e2e8f0; width: 100%; max-height: 10rem; overflow-y: auto; z-index: 999; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-radius: 0.5rem; margin-top: 3.62rem; left: 0;"></div>
                    </div>
                    
                    <!-- Удобный горизонтальный счетчик количества -->
                    <div style="display: flex; flex-direction: column; align-items: flex-start; flex-shrink: 0;">
                        <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Кол-во</label>
                        <div style="display: flex; align-items: center; border: 1px solid #e2e8f0; border-radius: 0.5rem; background: #ffffff; height: 2.35rem; box-sizing: border-box; overflow: hidden;">
                            <!-- Кнопка Минус -->
                            <button onclick="changeAddQtyBtn(-1)" style="width: 2.2rem; height: 100%; background: #f8fafc; border: none; font-size: 1.1rem; font-weight: 600; color: #64748b; cursor: pointer; transition: background 0.1s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='#f8fafc'">−</button>
                            <!-- Поле ввода цифры -->
                            <input type="number" id="prodQty" min="1" value="1" style="width: 2.2rem; height: 100%; border: none; text-align: center; font-size: 0.875rem; font-weight: 600; color: #334155; -moz-appearance: textfield; margin: 0; outline: none;">
                            <!-- Кнопка Плюс -->
                            <button onclick="changeAddQtyBtn(1)" style="width: 2.2rem; height: 100%; background: #f8fafc; border: none; font-size: 1.1rem; font-weight: 600; color: #64748b; cursor: pointer; transition: background 0.1s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='#f8fafc'">+</button>
                        </div>
                    </div>

                <!-- Выбор Полки -->
                <div style="display: flex !important; flex-direction: column !important; width: 100% !important; align-items: flex-start !important;">
                    <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Выберите полку</label>
                    <div id="shelfRadioContainer" style="display: flex; flex-wrap: wrap; gap: 0.5rem; width: 100%;"></div>
                </div>
                
                <!-- Поле срока хранения перенесено строго вниз -->
                <div style="display: flex !important; flex-direction: column !important; width: 100% !important; align-items: flex-start !important;">
                    <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Срок годности (дней)</label>
                    <input type="number" id="prodDays" value="5" min="0" class="form-input" style="width: 100% !important; display: block !important; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.625rem; box-sizing: border-box; font-size: 0.875rem;">
                </div>
                
                <!-- Кнопки действий: Отмена слева, Сохранить справа -->
                <div class="form-actions" style="display: flex !important; flex-direction: row !important; gap: 0.75rem !important; margin-top: 1rem !important; width: 100% !important;">
                    <button onclick="closeModal()" class="btn-cancel" style="flex: 1; padding: 0.625rem 0; background-color: #f1f5f9; color: #475569; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem;">Отмена</button>
                    <button onclick="addProduct()" class="btn-submit" style="flex: 1; padding: 0.625rem 0; background-color: #4f46e5; color: #ffffff; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem;">Сохранить</button>
                </div>
            </div>
        </div>

    </div>

    <!-- АВТОНОМНЫЙ СКРИПТ ЛОГИКИ -->
    <script>
        const emojiMap = {
            'молоко': '🥛', 'сыр': '🧀', 'яйца': '🥚', 'томаты': '🍅', 'помидор': '🍅', 'помидоры': '🍅',
            'яблоко': '🍎', 'яблоки': '🍎', 'банан': '🍌', 'бананы': '🍌', 'колбаса': '🥩', 'мясо': '🥩',
            'рыба': '🐟', 'огурец': '🥒', 'огурцы': '🥒', 'лимон': '🍋', 'хлеб': '🍞', 'соус': '🥫', 'кетчуп': '🥫',
            'масло': '🧈', 'йогурт': '🍦', 'пиво': '🍺', 'вино': '🍷', 'сок': '🧃'
        };

        const getEmoji = (name) => {
            const cleanName = name.toLowerCase().trim();
            for (const key in emojiMap) {
                if (cleanName.includes(key)) return emojiMap[key];
            }
            return '📦';
        };
        
        let recipesDatabase = JSON.parse(localStorage.getItem('my_custom_recipes')) || [
            {
                id: 101,
                title: "Классический омлет",
                ingredients: [{ name: "Яйца", qty: 2 }, { name: "Молоко", qty: 1 }]
            },
            {
                id: 102,
                title: "Свежий салат",
                ingredients: [{ name: "Томаты", qty: 2 }, { name: "Огурец", qty: 1 }]
            },
            {
                id: 103,
                title: "Бутерброд с сыром",
                ingredients: [{ name: "Хлеб", qty: 1 }, { name: "Сыр", qty: 1 }]
            }
        ];

        // Динамическая двухуровневая структура полок: Группа -> Список полок внутри нее
        let groups = JSON.parse(localStorage.getItem('my_fridge_groups')) || [
            {
                id: 'g1',
                name: 'Холодильное отделение',
                shelves: ['Верхняя полка', 'Средняя полка', 'Нижняя полка', 'Полки на двери']
            },
            {
                id: 'g3',
                name: 'Морозильная камера',
                shelves: ['Верхний ящик', 'Нижний ящик']
            }
        ];

        let products = JSON.parse(localStorage.getItem('my_fridge_items')) || [
            { id: 1, name: 'Молоко', qty: 2, shelf: 'Верхняя полка', daysLeft: 3 },
            { id: 2, name: 'Томаты', qty: 5, shelf: 'Нижняя полка', daysLeft: 7 },
            { id: 3, name: 'Сыр', qty: 1, shelf: 'Средняя полка', daysLeft: 1 },
            { id: 4, name: 'Яйца', qty: 10, shelf: 'Средняя полка', daysLeft: 12 },
            { id: 5, name: 'Соус', qty: 1, shelf: 'Полки на двери', daysLeft: 30 }
        ];

        let currentScreen = 'fridge';
        let currentMode = 'classic';
        let historyUndo = [];
        let historyRedo = [];

        function saveState() {
            historyUndo.push(JSON.stringify(products));
            if (historyUndo.length > 20) historyUndo.shift();
            historyRedo = []; 
            updateHistoryButtons();
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
        }

        function undo() {
            if (historyUndo.length === 0) return;
            historyRedo.push(JSON.stringify(products));
            products = JSON.parse(historyUndo.pop());
            updateHistoryButtons();
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

        function redo() {
            if (historyRedo.length === 0) return;
            historyUndo.push(JSON.stringify(products));
            products = JSON.parse(historyRedo.pop());
            updateHistoryButtons();
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

        function updateHistoryButtons() {
            document.getElementById('btnUndo').disabled = historyUndo.length === 0;
            document.getElementById('btnRedo').disabled = historyRedo.length === 0;
        }

        function switchScreen(screen) {
            currentScreen = screen;
            const title = document.getElementById('appTitle');
            const filterBar = document.getElementById('filterBar');
            const addBtn = document.getElementById('stickyAddBtn');
            const navFridge = document.getElementById('navFridge');
            const navRecipes = document.getElementById('navRecipes');

            if (screen === 'fridge') {
                title.innerHTML = '<span>🥛</span> Холодильник';
                filterBar.classList.remove('hidden');
                addBtn.classList.remove('hidden'); // Показываем плюс в холодильнике
                navFridge.className = "nav-btn nav-active";
                navRecipes.className = "nav-btn nav-inactive";
            } else if (screen === 'recipes') {
                title.innerHTML = '<span>📖</span> Книга рецептов';
                filterBar.classList.add('hidden');
                addBtn.classList.remove('hidden'); // ЧЁТКАЯ ПРАВКА: Показываем плюс и в рецептах тоже!
                navFridge.className = "nav-btn nav-inactive";
                navRecipes.className = "nav-btn nav-active";
            } else if (screen === 'settings') {
                title.innerHTML = '<span>⚙️</span> Настройка полок';
                filterBar.classList.add('hidden');
                addBtn.classList.add('hidden'); // Скрываем плюс в настройках
                navFridge.className = "nav-btn nav-inactive";
                navRecipes.className = "nav-btn nav-inactive";
            }
            render();
        }

        function render() {
            const container = document.getElementById('mainContainer');
            if (!container) return;
            container.innerHTML = '';
            
            if (currentScreen === 'fridge') { renderFridge(container); } 
            else if (currentScreen === 'recipes') { renderRecipes(container); }
            else if (currentScreen === 'settings') { renderSettings(container); }
        }

        function renderFridge(container) {
            let displayItems = JSON.parse(JSON.stringify(products));

            // ЧЁТКАЯ ПРАВКА: Если выбран режим "По расположению" (classic), мы рисуем сгруппированные зоны и полки
            if (currentMode === 'classic') {
                groups.forEach(group => {
                    const groupDiv = document.createElement('div');
                    groupDiv.style.marginBottom = '2rem';
                    groupDiv.style.backgroundColor = '#f8fafc';
                    groupDiv.style.borderRadius = '1rem';
                    groupDiv.style.padding = '1rem';
                    groupDiv.style.border = '1px solid #e2e8f0';
                    
                    groupDiv.innerHTML = `<h3 style="font-size: 0.95rem; font-weight: 800; color: #4f46e5; margin-top: 0; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">${group.name}</h3>`;
                    
                    group.shelves.forEach(shelfName => {
                        const shelfItems = displayItems.filter(item => item.shelf === shelfName);
                        
                        const shelfDiv = document.createElement('div');
                        shelfDiv.className = 'shelf-section';
                        shelfDiv.innerHTML = `
                            <h4 class="shelf-title" style="color: #64748b; font-size: 0.75rem;">${shelfName}</h4>
                            <div class="shelf-border" data-shelf="${shelfName}" ondragover="event.preventDefault(); this.classList.add('shelf-hover');" ondragleave="this.classList.remove('shelf-hover');" ondrop="handleProductDrop(event, '${shelfName}')">
                                ${shelfItems.length === 0 ? '<span class="empty-shelf">Полка пуста</span>' : ''}
                            </div>
                        `;
                        const shelfList = shelfDiv.querySelector('.shelf-border');
                        // В режиме "По расположению" продукты на полках показываются просто в порядке их добавления
                        shelfItems.forEach(item => { shelfList.appendChild(createProductCard(item)); });
                        groupDiv.appendChild(shelfDiv);
                    });
                    
                    container.appendChild(groupDiv);
                });
            } else {
                // ИНАЧЕ: Если выбраны Срок, Алфавит или Дата — мы применяем сортировку КО ВСЕМ продуктам сразу
                if (currentMode === 'expiry') { displayItems.sort((a, b) => a.daysLeft - b.daysLeft); } 
                else if (currentMode === 'alpha') { displayItems.sort((a, b) => a.name.localeCompare(b.name, 'ru')); } // Сортировка с поддержкой русского языка
                else if (currentMode === 'newest') { displayItems.sort((a, b) => b.id - a.id); }

                // Отрисовываем отсортированные продукты в красивый гибкий флекс-ряд
                const listDiv = document.createElement('div');
                listDiv.className = 'list-grid';
                displayItems.forEach(item => { listDiv.appendChild(createProductCard(item)); });
                container.appendChild(listDiv);
            }
        }

        function createProductCard(item) {
            const card = document.createElement('div');
            const isExpiring = item.daysLeft <= 1;
            card.className = `product-card ${isExpiring ? 'product-expiring' : ''}`;
            
            // Сохраняем встроенный drag-and-drop
            card.draggable = true;
            card.ondragstart = (e) => { e.dataTransfer.setData('text/plain', item.id); };

            // ЧЁТКАЯ ПРАВКА: Запоминаем ID карточки, над которой ведут перетаскивание, для точной сортировки внутри полки
            card.setAttribute('data-id', item.id);

            card.onclick = () => openProductDetailsModal(item.id);
            card.innerHTML = `
                <span class="product-emoji">${getEmoji(item.name)}</span>
                <span class="product-name">${item.name}</span>
                ${item.qty > 1 ? `<span class="product-badge">${item.qty}</span>` : ''}
                <span class="product-days ${isExpiring ? 'text-rose' : ''}">${item.daysLeft} дн.</span>
            `;
            return card;
        }

        function renderRecipes(container) {
            const listDiv = document.createElement('div');
            recipesDatabase.forEach(recipe => {
                let canCook = true;
                let missingIngredients = 0;
                const ingStatus = recipe.ingredients.map(ing => {
                    const inFridge = products.filter(p => p.name.toLowerCase().trim() === ing.name.toLowerCase().trim()).reduce((sum, p) => sum + p.qty, 0);
                    const hasEnough = inFridge >= ing.qty;
                    if (!hasEnough) { canCook = false; missingIngredients++; }
                    return { ...ing, available: inFridge, ok: hasEnough };
                });

                const card = document.createElement('div');
                card.onclick = () => openEditRecipeModal(recipe.id);
                card.style.cursor = 'pointer'; // Делаем карточку явно кликабельной
                card.className = `recipe-card ${canCook ? 'recipe-cookable' : ''}`;
                let ingredientsHTML = ingStatus.map(ing => `
                    <div class="ingredient-row">
                        <span class="${ing.ok ? 'ing-name-ok' : 'ing-name-missing'}">${getEmoji(ing.name)} ${ing.name} (${ing.qty} шт.)</span>
                        <span class="${ing.ok ? 'ing-status-ok' : 'ing-status-missing'}">${ing.ok ? '✓' : `Мало (есть ${ing.available})`}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="recipe-header">
                        <div>
                            <h3 class="recipe-title">${recipe.title}</h3>
                            <p class="recipe-subtitle">Компонентов: ${recipe.ingredients.length}</p>
                        </div>
                        <span class="badge-status ${canCook ? 'badge-emerald' : 'badge-amber'}">${canCook ? 'Можно готовить' : `Нет продуктов: ${missingIngredients}`}</span>

        function cookRecipe(recipeId) {
            const recipe = recipesDatabase.find(r => r.id === recipeId);
            if (!recipe) return;
            saveState();
            recipe.ingredients.forEach(ing => {
                let needed = ing.qty;
                for (let i = 0; i < products.length; i++) {
                    if (products[i].name.toLowerCase().trim() === ing.name.toLowerCase().trim()) {
                        if (products[i].qty >= needed) { products[i].qty -= needed; needed = 0; } 
                        else { needed -= products[i].qty; products[i].qty = 0; }
                    }
                    if (needed === 0) break;
                }
            });
            products = products.filter(p => p.qty > 0);
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            alert(`Успешно приготовлено! Продукты удалены с полок.`);
            render();
        }

        function addProduct() {
            const nameInput = document.getElementById('prodName');
            let rawName = nameInput.value.trim();
            if (!rawName) return alert('Напишите название продукта!');
            // Превращаем первую букву в заглавную, а остальные оставляем как есть
            const name = rawName.charAt(0).toUpperCase() + rawName.slice(1);
            const qty = parseInt(document.getElementById('prodQty').value) || 1;
            const shelf = selectedShelf;
            const daysLeft = parseInt(document.getElementById('prodDays').value) || 5;

            if (!name) return alert('Напишите название продукта!');
            saveState();
            
            // ЧЁТКАЯ ПРАВКА: Ищем совпадение по имени, полке И сроку годности одновременно
            const existing = products.find(p => 
                p.name.toLowerCase() === name.toLowerCase() && 
                p.shelf === shelf &&
                p.daysLeft === daysLeft
            );

            if (existing) { existing.qty += qty; } 
            else { products.push({ id: Date.now(), name, qty, shelf, daysLeft }); }

            nameInput.value = '';
            document.getElementById('prodQty').value = '1';
            document.getElementById('prodDays').value = '5';
            closeModal();
            render();
        }

        function handleProductDrop(event, targetShelf) {
            event.preventDefault();
            const shelfElement = event.currentTarget;
            if (shelfElement) shelfElement.classList.remove('shelf-hover');

            const productId = parseInt(event.dataTransfer.getData('text/plain'));
            if (isNaN(productId)) return;

            const draggedProductIndex = products.findIndex(p => p.id === productId);
            if (draggedProductIndex === -1) return;

            const draggedProduct = products[draggedProductIndex];
            
            saveState();

            // Проверяем, был ли сброс выполнен поверх конкретной карточки продукта
            const targetCard = event.target.closest('.product-card');
            let targetItemId = null;
            if (targetCard) {
                targetItemId = parseInt(targetCard.getAttribute('data-id'));
            }

            // Проверяем, есть ли идентичный товар с ТАКИМ ЖЕ сроком годности на целевой полке для объединения
            const duplicateIndex = products.findIndex(p => 
                p.id !== productId &&
                p.name.toLowerCase().trim() === draggedProduct.name.toLowerCase().trim() && 
                p.shelf === targetShelf &&
                p.daysLeft === draggedProduct.daysLeft
            );

            if (duplicateIndex !== -1) {
                // Если такой товар нашелся — просто суммируем количество, как и раньше
                products[duplicateIndex].qty += draggedProduct.qty;
                products.splice(draggedProductIndex, 1);
            } else {
                // ИНАЧЕ: Меняем полку и выстраиваем точный порядковый номер
                draggedProduct.shelf = targetShelf;
                
                // Вырезаем элемент из старого места в массиве
                products.splice(draggedProductIndex, 1);

                if (targetItemId && !isNaN(targetItemId)) {
                    // Если бросили на конкретный продукт — находим его индекс и вставляем прямо перед ним
                    let insertIndex = products.findIndex(p => p.id === targetItemId);
                    if (insertIndex !== -1) {
                        products.splice(insertIndex, 0, draggedProduct);
                    } else {
                        products.push(draggedProduct);
                    }
                } else {
                    // Если бросили просто на пустую область полки — отправляем в самый конец списка этой полки
                    products.push(draggedProduct);
                }
            }

            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

        function renameShelf(index, oldName) {
            let newName = oldName.trim();
            if (!newName) return render();
            const currentOldName = shelves[index];
            
            // Синхронизируем имя полки у всех продуктов, которые на ней лежали
            products.forEach(p => {
                if (p.shelf === currentOldName) p.shelf = newName;
            });
            
            shelves[index] = newName;
            localStorage.setItem('my_fridge_shelves', JSON.stringify(shelves));
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

        function deleteShelf(index) {
            const shelfName = shelves[index];
            const hasProducts = products.some(p => p.shelf === shelfName);
            if (hasProducts) {
                if (!confirm(`На полке "${shelfName}" есть продукты. При удалении они автоматически перенесутся на первую доступную полку. Продолжить?`)) return;
            }
            
            shelves.splice(index, 1);
            if (shelves.length === 0) shelves.push('Основная полка');

            // Осиротевшие продукты перекидываем на первую оставшуюся полку
            products.forEach(p => {
                if (p.shelf === shelfName) p.shelf = shelves[0];
            });

            localStorage.setItem('my_fridge_shelves', JSON.stringify(shelves));
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

                            <button onclick="moveShelf(${gIndex}, ${sIndex}, -1)" style="background:none; border:none; font-size:0.85rem; cursor:pointer; color:#64748b;" ${sIndex === 0 ? 'disabled style="opacity:0.2;"' : ''}>▲</button>
                            <button onclick="moveShelf(${gIndex}, ${sIndex}, 1)" style="background:none; border:none; font-size:0.85rem; cursor:pointer; color:#64748b;" ${sIndex === group.shelves.length - 1 ? 'disabled style="opacity:0.2;"' : ''}>▼</button>
                            <input type="text" value="${shelfName}" onchange="renameShelf(${gIndex}, ${sIndex}, this.value)" style="border: 1px solid #cbd5e1; padding: 0.25rem; font-size: 0.8rem; border-radius: 0.25rem; flex-grow: 1; background: white; font-weight: 500; min-width: 0;">
                        </div>
                        <button onclick="deleteShelf(${gIndex}, ${sIndex})" style="background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 0.95rem; padding: 0.1rem 0.3rem;" title="Удалить полку">✕</button>
                    `;
                    shelvesContainer.appendChild(shelfItem);
                });

                groupBlock.appendChild(shelvesContainer);

                const btnAddShelf = document.createElement('button');
                btnAddShelf.textContent = '+ Добавить полку в эту зону';
                btnAddShelf.style.width = '100%';
                btnAddShelf.style.padding = '0.35rem';
                btnAddShelf.style.backgroundColor = 'transparent';
                btnAddShelf.style.color = '#4f46e5';
                btnAddShelf.style.border = '1px dashed #4f46e5';
                btnAddShelf.style.borderRadius = '0.5rem';
                btnAddShelf.style.fontSize = '0.75rem';
                btnAddShelf.style.fontWeight = '600';
                btnAddShelf.style.cursor = 'pointer';
                btnAddShelf.style.marginTop = '0.25rem';
                btnAddShelf.onclick = () => addNewShelf(gIndex);
                groupBlock.appendChild(btnAddShelf);

                listContainer.appendChild(groupBlock);
            });
        }

        function addNewGroup() {
            const newId = 'g_' + Date.now();
            groups.push({
                id: newId,
                name: 'Новая зона ' + (groups.length + 1),
                shelves: ['Новая полка 1']
            });
            localStorage.setItem('my_fridge_groups', JSON.stringify(groups));
            renderSettingsModalList();
            render();
        }

        function renameGroup(gIndex, newName) {
            const cleanName = newName.trim();
            if (!cleanName) return renderSettingsModalList();
            groups[gIndex].name = cleanName;
            localStorage.setItem('my_fridge_groups', JSON.stringify(groups));
            renderSettingsModalList();
            render();
        }

        function deleteGroup(gIndex) {
            const group = groups[gIndex];
            const affectedShelves = group.shelves;
            const hasProducts = products.some(p => affectedShelves.includes(p.shelf));
            
            if (hasProducts) {
                if (!confirm(`В зоне "${group.name}" есть полки с продуктами. При удалении зоны все её продукты будут автоматически перенесены на первую доступную полку в других зонах. Продолжить?`)) return;
            }

            groups.splice(gIndex, 1);
            if (groups.length === 0) {
                groups.push({ id: 'g_main', name: 'Основное отделение', shelves: ['Основная полка'] });
            }

            const fallbackShelf = groups[0].shelves[0];
            products.forEach(p => {
                if (affectedShelves.includes(p.shelf)) p.shelf = fallbackShelf;
            });

            localStorage.setItem('my_fridge_groups', JSON.stringify(groups));
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            renderSettingsModalList();
            render();
        }

        function moveGroup(gIndex, direction) {
            const targetIndex = gIndex + direction;
            if (targetIndex < 0 || targetIndex >= groups.length) return;
            const temp = groups[gIndex];
            groups[gIndex] = groups[targetIndex];
            groups[targetIndex] = temp;
            localStorage.setItem('my_fridge_groups', JSON.stringify(groups));
            renderSettingsModalList();
            render();
        }

        function addNewShelf(gIndex) {
            const group = groups[gIndex];
            group.shelves.push('Новая полка ' + (group.shelves.length + 1));
            localStorage.setItem('my_fridge_groups', JSON.stringify(groups));
            renderSettingsModalList();
            render();
        }

        function renameShelf(gIndex, sIndex, newName) {
            const cleanName = newName.trim();
            if (!cleanName) return renderSettingsModalList();
            
            const oldShelfName = groups[gIndex].shelves[sIndex];
            products.forEach(p => {
                if (p.shelf === oldShelfName) p.shelf = cleanName;
            });

            groups[gIndex].shelves[sIndex] = cleanName;
            localStorage.setItem('my_fridge_groups', JSON.stringify(groups));
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            renderSettingsModalList();
            render();
        }

        function deleteShelf(gIndex, sIndex) {
            const shelfName = groups[gIndex].shelves[sIndex];
            const hasProducts = products.some(p => p.shelf === shelfName);
            
            if (hasProducts) {
                if (!confirm(`На полке "${shelfName}" есть продукты. При удалении полки они автоматически перенесутся на первую доступную полку. Продолжить?`)) return;
            }

            groups[gIndex].shelves.splice(sIndex, 1);
            
            if (groups[gIndex].shelves.length === 0) {
                groups[gIndex].shelves.push('Основная полка группы');
            }

            const fallbackShelf = groups[0].shelves[0];
            products.forEach(p => {
                if (p.shelf === shelfName) p.shelf = fallbackShelf;
            });

            localStorage.setItem('my_fridge_groups', JSON.stringify(groups));
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            renderSettingsModalList();
            render();
        }

        function moveShelf(gIndex, sIndex, direction) {
            const targetIndex = sIndex + direction;
            const group = groups[gIndex];
            if (targetIndex < 0 || targetIndex >= group.shelves.length) return;
            
            const temp = group.shelves[sIndex];
            group.shelves[sIndex] = group.shelves[targetIndex];
            group.shelves[targetIndex] = temp;

            localStorage.setItem('my_fridge_groups', JSON.stringify(groups));
            renderSettingsModalList();
            render();
        }

        // --- ЛОГИКА ДИНАМИЧЕСКИХ СТРОК ИНГРЕДИЕНТОВ ---
        function openAddRecipeModal() {
            document.getElementById('addRecipeModal').classList.remove('hidden');
            document.getElementById('recipeIngredientsListContainer').innerHTML = '';
            document.getElementById('recName').value = '';
            
            // Сразу добавляем одну пустую строчку для удобства
            addIngredientRowToForm();
            
            // Автофокус на название блюда
            setTimeout(() => {
                const input = document.getElementById('recName');
                if (input) input.focus();
            }, 50);
        }

        function closeAddRecipeModal() {
            document.getElementById('addRecipeModal').classList.add('hidden');
        }

        function addIngredientRowToForm() {
            const container = document.getElementById('recipeIngredientsListContainer');
            if (!container) return;

            const row = document.createElement('div');
            row.className = 'form-ingredient-row';
            row.style.display = 'flex';
            row.style.gap = '0.5rem';
            row.style.alignItems = 'center';
            row.style.width = '100%';

            row.innerHTML = `
                <input type="text" placeholder="Ингредиент" oninput="validateRecipeIngredients('form-ingredient-row', 'rec-ing-name')" class="form-input rec-ing-name" autocomplete="off" style="flex: 2; font-size: 0.8rem; padding: 0.4rem 0.5rem;">
                <!-- Консистентный счетчик количества с кнопками плюс и минус -->
                <div style="display: flex; align-items: center; border: 1px solid #e2e8f0; border-radius: 0.5rem; background: #ffffff; height: 2rem; box-sizing: border-box; overflow: hidden; flex-shrink: 0;">
                    <button onclick="let inp = this.nextElementSibling; let v = parseInt(inp.value)||1; if(v>1) inp.value=v-1;" style="width: 1.5rem; height: 100%; background: #f8fafc; border: none; font-size: 1rem; font-weight: 600; color: #64748b; cursor: pointer;">−</button>
                    <input type="number" value="1" min="1" class="rec-ing-qty" style="width: 2rem; height: 100%; border: none; text-align: center; font-size: 0.8rem; font-weight: 600; color: #334155; outline: none; -moz-appearance: textfield;">
                    <button onclick="let inp = this.previousElementSibling; let v = parseInt(inp.value)||1; inp.value=v+1;" style="width: 1.5rem; height: 100%; background: #f8fafc; border: none; font-size: 1rem; font-weight: 600; color: #64748b; cursor: pointer;">+</button>
                </div>
                <button onclick="this.parentElement.remove()" style="background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 0.25rem 0.5rem;" title="Удалить ингредиент">✕</button>
            `;
            container.appendChild(row);
            
            // АВТОФОКУС: находим инпут в только что добавленной строке и ставим туда курсор
            const newInp = row.querySelector('.rec-ing-name');
            if (newInp) newInp.focus();
        }

        function validateRecipeIngredients(rowClassName, inputClassName) {
            const rows = document.querySelectorAll('.' + rowClassName);
            const namesSeen = {};
            let hasDuplicates = false;

            // Сначала собираем информацию о том, какие имена сколько раз встречаются
            rows.forEach(row => {
                const nameInp = row.querySelector('.' + inputClassName);
                if (nameInp) {
                    const name = nameInp.value.trim().toLowerCase();
                    if (name) {
                        namesSeen[name] = (namesSeen[name] || 0) + 1;
                    }
                }
            });

            // Красим инпуты: если имя встречается больше 1 раза — делаем его красным
            rows.forEach(row => {
                const nameInp = row.querySelector('.' + inputClassName);
                if (nameInp) {
                    const name = nameInp.value.trim().toLowerCase();
                    if (name && namesSeen[name] > 1) {
                        nameInp.style.borderColor = '#ef4444';
                        nameInp.style.backgroundColor = '#fef2f2';
                        hasDuplicates = true;
                    } else {
                        // Возвращаем стандартный цвет, если всё в порядке
                        nameInp.style.borderColor = '#e2e8f0';
                        nameInp.style.backgroundColor = '#ffffff';
                    }
                }
            });

            return hasDuplicates;
        }

        function saveCustomRecipe() {
            if (validateRecipeIngredients('form-ingredient-row', 'rec-ing-name')) {
                return alert('В рецепте есть одинаковые ингредиенты! Пожалуйста, измените или удалите дубликаты.');
            }
            
            const titleInput = document.getElementById('recName');
            let rawTitle = titleInput.value.trim();
            if (!rawTitle) return alert('Напишите название блюда!');

            // Делаем первую букву названия заглавной
            const title = rawTitle.charAt(0).toUpperCase() + rawTitle.slice(1);

            const rows = document.querySelectorAll('.form-ingredient-row');
            const ingredients = [];

            // Собираем данные из всех динамических строчек формы
            rows.forEach(row => {
                const nameInp = row.querySelector('.rec-ing-name');
                const qtyInp = row.querySelector('.rec-ing-qty');
                
                if (nameInp && qtyInp) {
                    let rawIngName = nameInp.value.trim();
                    let ingQty = parseInt(qtyInp.value) || 1;
                    
                    if (rawIngName) {
                        // Капитализируем имя ингредиента, чтобы оно идеально матчилось с продуктами
                        const ingName = rawIngName.charAt(0).toUpperCase() + rawIngName.slice(1);
                        ingredients.push({ name: ingName, qty: ingQty });
                    }
                }
            });

            if (ingredients.length === 0) {
                return alert('Добавьте хотя бы один ингредиент к рецепту!');
            }

            // Добавляем новый рецепт в массив
            recipesDatabase.push({
                id: Date.now(), // Уникальный id на основе времени
                title: title,
                ingredients: ingredients
            });

            // Сохраняем базу в память смартфона и обновляем интерфейс
            localStorage.setItem('my_custom_recipes', JSON.stringify(recipesDatabase));
            closeAddRecipeModal();
            render();
        }

        let activeEditingRecipeId = null;

        function openEditRecipeModal(id) {
            const recipe = recipesDatabase.find(r => r.id === id);
            if (!recipe) return;

            activeEditingRecipeId = id;
            document.getElementById('editRecName').value = recipe.title;
            
            const container = document.getElementById('editRecipeIngredientsListContainer');
            if (container) {
                container.innerHTML = '';
                recipe.ingredients.forEach(ing => {
                    addIngredientRowToEditForm(ing.name, ing.qty);
                });
            }

            document.getElementById('editRecipeModal').classList.remove('hidden');
        }

        function closeEditRecipeModal() {
            document.getElementById('editRecipeModal').classList.add('hidden');
            activeEditingRecipeId = null;
        }

        function addIngredientRowToEditForm(name = '', qty = 1) {
            const container = document.getElementById('editRecipeIngredientsListContainer');
            if (!container) return;

            const row = document.createElement('div');
            row.className = 'form-ingredient-row-edit';
            row.style.display = 'flex';
            row.style.gap = '0.5rem';
            row.style.alignItems = 'center';
            row.style.width = '100%';

            row.innerHTML = `
                <input type="text" placeholder="Ингредиент" oninput="validateRecipeIngredients('form-ingredient-row-edit', 'edit-rec-ing-name')" value="${name}" class="form-input edit-rec-ing-name" autocomplete="off" style="flex: 2; font-size: 0.8rem; padding: 0.4rem 0.5rem;">
                <div style="display: flex; align-items: center; border: 1px solid #e2e8f0; border-radius: 0.5rem; background: #ffffff; height: 2rem; box-sizing: border-box; overflow: hidden; flex-shrink: 0;">
                    <button onclick="let inp = this.nextElementSibling; let v = parseInt(inp.value)||1; if(v>1) inp.value=v-1;" style="width: 1.5rem; height: 100%; background: #f8fafc; border: none; font-size: 1rem; font-weight: 600; color: #64748b; cursor: pointer;">−</button>
                    <input type="number" value="${qty}" min="1" class="edit-rec-ing-qty" style="width: 2rem; height: 100%; border: none; text-align: center; font-size: 0.8rem; font-weight: 600; color: #334155; outline: none; -moz-appearance: textfield;">
                    <button onclick="let inp = this.previousElementSibling; let v = parseInt(inp.value)||1; inp.value=v+1;" style="width: 1.5rem; height: 100%; background: #f8fafc; border: none; font-size: 1rem; font-weight: 600; color: #64748b; cursor: pointer;">+</button>
                </div>
                <button onclick="this.parentElement.remove()" style="background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 0.25rem 0.5rem;" title="Удалить ингредиент">✕</button>
            `;
            container.appendChild(row);
            
            // АВТОФОКУС: находим инпут в только что добавленной строке редактирования
            const newInp = row.querySelector('.edit-rec-ing-name');
            if (newInp) newInp.focus();

        }

        function saveEditRecipeDetails() {
            if (validateRecipeIngredients('form-ingredient-row-edit', 'edit-rec-ing-name')) {
                return alert('В рецепте есть одинаковые ингредиенты! Пожалуйста, измените или удалите дубликаты.');
            }

            if (activeEditingRecipeId === null) return;
            const recipe = recipesDatabase.find(r => r.id === activeEditingRecipeId);
            if (!recipe) return;

            const titleInput = document.getElementById('editRecName');
            let rawTitle = titleInput.value.trim();
            if (!rawTitle) return alert('Название блюда не может быть пустым!');

            const title = rawTitle.charAt(0).toUpperCase() + rawTitle.slice(1);
            const rows = document.querySelectorAll('.form-ingredient-row-edit');
            const ingredients = [];

            rows.forEach(row => {
                const nameInp = row.querySelector('.edit-rec-ing-name');
                const qtyInp = row.querySelector('.edit-rec-ing-qty');
                
                if (nameInp && qtyInp) {
                    let rawIngName = nameInp.value.trim();
                    let ingQty = parseInt(qtyInp.value) || 1;
                    
                    if (rawIngName) {
                        const ingName = rawIngName.charAt(0).toUpperCase() + rawIngName.slice(1);
                        ingredients.push({ name: ingName, qty: ingQty });
                    }
                }
            });

            if (ingredients.length === 0) {
                return alert('Добавьте хотя бы один ингредиент к рецепту!');
            }

            recipe.title = title;
            recipe.ingredients = ingredients;

            localStorage.setItem('my_custom_recipes', JSON.stringify(recipesDatabase));
            closeEditRecipeModal();
            render();
        }

        function deleteRecipeFromDetails() {
            if (activeEditingRecipeId === null) return;
            if (!confirm('Вы действительно хотите удалить этот рецепт?')) return;

            recipesDatabase = recipesDatabase.filter(r => r.id !== activeEditingRecipeId);
            localStorage.setItem('my_custom_recipes', JSON.stringify(recipesDatabase));
            closeEditRecipeModal();
            render();
        }

        render();
    </script>
</body>
</html>
