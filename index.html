<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Умный Холодильник — Преврати хаос в порядок!</title>
    <style>
    /* Встраиваем базовые стили приложения прямо в файл, чтобы не зависеть от серверов */
    body {
        /* Адаптивное поведение шапки на ПК (блоки облегают контент) и мобильных устройствах */
        .adaptive-sort-select { width: 13rem; flex-grow: 0; }
        .header-filter-block { flex-grow: 0; flex-shrink: 0; display: flex; align-items: center; gap: 0.5rem; }
        
        @media (max-width: 540px) {
            /* На мобильных экранах Блок 2 (фильтры) падает вниз и растягивается на всю ширину */
            .header-filter-block { width: 100% !important; justify-content: space-between !important; order: 3 !important; }
            .adaptive-sort-select { width: 100% !important; flex-grow: 1 !important; max-width: none !important; }
            
            /* Блок 1 (название) и Блок Истории остаются сверху и делят первую строчку */
            .header-title-block { flex-grow: 1 !important; order: 1 !important; }
            .header-history-block { order: 2 !important; }
        }

        /* Анимация вращения ИИ-лоадера */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Убираем дефолтные стрелочки у всех input type="number" */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        background-color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; color: #334155; margin: 0; padding: 0; }
        .app-container { width: 100%; max-width: 960px; margin: 0 auto; background-color: #ffffff; height: 100vh; max-height: 100vh; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); flex-direction: column; display: flex; position: relative; overflow: hidden; }
        header { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem; position: fixed; top: 0; width: 100%; max-width: 960px; z-index: 100; box-sizing: border-box; height: 3.5rem; display: flex; align-items: center; }
        .header-top { display: flex; justify-content: space-between; items-center: center; align-items: center; margin-bottom: 0.75rem; }
        h1 { font-size: 1.25rem; font-weight: 700; color: #4f46e5; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
        .history-btns { display: flex; gap: 0.5rem; }
        .btn-action { padding: 0.5rem; border-radius: 9999px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-action:hover { background-color: #f1f5f9; }
        .btn-action:disabled { opacity: 0.3; cursor: not-allowed; }
        .filter-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; font-size: 0.875rem; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .tab-btn { px-3; padding: 0.375rem 0.75rem; border-radius: 9999px; border: none; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color 0.2s; }
        .tab-active { background-color: #4f46e5; color: #ffffff; }
        .tab-inactive { background-color: #f1f5f9; color: #475569; }
        .tab-inactive:hover { background-color: #e2e8f0; }
        .tab-amber { background-color: #f59e0b; color: #ffffff; }
        main { flex-grow: 1; padding: 1rem; overflow-y: auto; padding-bottom: 6rem; }
        .shelf-section { margin-bottom: 1.5rem; }
        .shelf-title { font-size: 0.75rem; font-weight: 700; color: #94a3b8; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; padding-left: 0.25rem; }
        .shelf-border { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.75rem; background-color: #ffffff; border: 2px dashed #e2e8f0; border-radius: 0.75rem; min-height: 4.5rem; transition: all 0.2s; width: 100%; box-sizing: border-box; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .shelf-hover { background-color: rgba(79, 70, 229, 0.15) !important; border-color: #4f46e5 !important; }
        .list-grid { display: flex; flex-wrap: wrap; gap: 1rem; padding: 0.5rem; justify-content: flex-start; }
        .product-card { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.25rem 0.15rem; cursor: pointer; transition: all 0.2s; position: relative; gap: 0.15rem; box-sizing: border-box; height: 4.8rem; width: 64px; text-align: center; flex-shrink: 0; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .product-spoiled { background-color: #fff1f2 !important; border-color: #fca5a5 !important; }
        .spoiled-sticker { background-color: #ef4444; color: #ffffff; font-size: 0.5rem; font-weight: 500; padding: 0.2rem 0.5rem; border-radius: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 3px rgba(239, 68, 68, 0.2); height: 1.25rem; box-sizing: border-box; margin: 0; }
        .text-spoiled { color: #dc2626 !important; font-weight: 800 !important; font-size: 0.7rem !important; text-transform: uppercase; letter-spacing: 0.05em; }
        .product-expiring { background-color: #fff1f2; border-color: #fca5a5; }
        .product-warning { background-color: #fff7ed; border-color: #fed7aa; }
        .text-orange { color: #ea580c; font-weight: 700; }
        .product-emoji { font-size: 1.875rem; margin-bottom: 0.25rem; user-select: none; }
        .product-name { font-size: 10px; text-align: center; font-weight: 500; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #334155; }
        .product-badge { position: absolute; top: -0.25rem; right: -0.25rem; background-color: #4f46e5; color: #ffffff; font-size: 0.6rem; font-weight: 700; min-width: 0.95rem; height: 0.95rem; padding: 0 0.15rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; z-index: 15; box-shadow: 0 1px 3px rgba(79, 70, 229, 0.4); }
        .product-days { font-size: 8px; margin-top: 0.125rem; font-weight: 600; color: #94a3b8; }
        .text-rose { color: #e11d48; font-weight: 700; }
        .trash-overlay { position: absolute; id: 0; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(239,68,68,0.1); border-radius: 0.75rem; opacity: 0; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
        .product-card:hover .trash-overlay { opacity: 1; }
        .empty-shelf { font-size: 0.75rem; font-style: italic; color: #cbd5e1; margin: auto; padding: 1rem 0; }
        /* Стили для Книги рецептов и всплывающих окон */
        .recipe-card { padding: 1rem; border-radius: 1rem; border: 1px solid #e2e8f0; background-color: #ffffff; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); margin-bottom: 1rem; }
        .recipe-cookable { border-color: #a7f3d0; background-color: rgba(240, 253, 250, 0.5); }
        .recipe-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .recipe-title { font-weight: 700; color: #1e293b; margin: 0; font-size: 1rem; }
        .recipe-subtitle { font-size: 11px; color: #94a3b8; margin: 0; }
        .badge-status { padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 10px; font-weight: 700; }
        .badge-emerald { background-color: #d1fae5; color: #065f46; }
        .badge-amber { background-color: #fef3c7; color: #92400e; }
        .ingredient-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; margin-top: 0.25rem; }
        .ing-name-ok { color: #334155; }
        .ing-name-missing { color: #e11d48; font-weight: 500; }
        .ing-status-ok { color: #059669; }
        .ing-status-missing { color: #f43f5e; }
        .btn-cook { w-full; width: 100%; bg-color: #059669; background-color: #059669; color: #ffffff; font-weight: 500; padding: 0.375rem 0; border-radius: 0.5rem; font-size: 0.75rem; border: none; cursor: pointer; margin-top: 0.75rem; transition: background-color 0.2s; }
        .btn-cook:hover { background-color: #047857; }
        .floating-btn { position: fixed; bottom: 5.5rem; right: calc(50% - 480px + 1.5rem); z-index: 110; }
        @media (max-width: 960px) { .floating-btn { right: 1.5rem; } }
        .btn-plus { width: 3.5rem; height: 3.5rem; background-color: #4f46e5; color: #ffffff; border-radius: 9999px; border: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; }
        .btn-plus:hover { background-color: #4338ca; transform: scale(1.05); }
        .btn-plus svg { width: 2rem; height: 2rem; }
        footer { background-color: #ffffff; border-top: 1px solid #e2e8f0; padding: 0.5rem 0; display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; max-width: 960px; box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.05); z-index: 100; box-sizing: border-box; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.125rem; background: transparent; border: none; cursor: pointer; font-size: 0.75rem; width: 33%; padding: 0.375rem 0; }
        .nav-active { color: #4f46e5; font-weight: 600; }
        .nav-inactive { color: #94a3b8; }
        .nav-inactive:hover { color: #475569; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        .modal-content { background-color: #ffffff; border-radius: 1rem; width: 100%; max-width: 24rem; padding: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); box-sizing: border-box; }
        .modal-title { font-size: 1.125rem; font-weight: 700; margin-top: 0; margin-bottom: 1rem; color: #0f172a; }
        .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; width: 100%; box-sizing: border-box; }
        .form-label { display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem; }
        .form-input, .form-select { w-full; width: 100%; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.625rem; box-sizing: border-box; font-size: 0.875rem; }
        /* Осветляем цвет плейсхолдера, чтобы он не путался с введенным текстом */
        .form-input::placeholder { color: #cbd5e1; opacity: 1; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #4f46e5; }
        .form-row { display: flex; flex-direction: column; gap: 0rem; width: 100%; }
        .form-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
        .btn-cancel { flex: 1; padding: 0.625rem 0; background-color: #f1f5f9; color: #475569; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem; text-align: center; }
        .btn-cancel:hover { background-color: #e2e8f0; }
        .btn-submit { flex: 1; padding: 0.625rem 0; background-color: #4f46e5; color: #ffffff; font-weight: 500; border-radius: 0.5rem; border: none; cursor: pointer; font-size: 0.875rem; text-align: center; }
        .btn-submit:hover { background-color: #4338ca; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <!-- Обновленная адаптивная шапка с динамическим изменением порядка элементов -->
            <header style="background-color: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 0.5rem 1rem; position: fixed; top: 0; width: 100%; max-width: 960px; z-index: 100; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; height: auto !important; min-height: 3.5rem;">
                
                <!-- БЛОК 1: Название экрана ❄️ -->
                <div class="header-title-block" style="display: flex; align-items: center; flex: 1; min-width: 10rem; order: 1;">
                    <h1 id="appTitle" style="font-size: 1.125rem; font-weight: 800; color: #0f172a; margin: 0; display: flex; align-items: center; gap: 0.35rem;">
                        <span>❄️</span> Холодильник
                    </h1>
                </div>

                <!-- БЛОК ИСТОРИИ: Кнопки отмены (Undo/Redo) с динамическим порядком order -->
                <div class="header-history-block" style="display: flex; gap: 0.15rem; align-items: center; flex-shrink: 0; order: 2;">
                    <button onclick="undo()" id="undoBtn" class="history-btn opacity-50" disabled style="padding: 0.35rem; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;" title="Отменить действие (Ctrl+Z)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                    </button>
                    <button onclick="redo()" id="redoBtn" class="history-btn opacity-50" disabled style="padding: 0.35rem; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;" title="Повторить действие (Ctrl+Y)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
                    </button>
                </div>

                <!-- БЛОК 2: Элементы фильтрации и настроек -->
                <div class="header-filter-block" style="display: flex; align-items: center; gap: 0.5rem; order: 3; justify-content: flex-end;">
                    
                    <!-- Скрытый системный инпут, который открывает камеру на смартфонах -->
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleCameraFile(this)" style="display: none;">

                    <!-- Кнопка ИИ-Сканирования 📸 -->
                    <button onclick="document.getElementById('cameraInput').click()" style="display: flex; align-items: center; justify-content: center; padding: 0.4rem 0.5rem; background-color: #e0e7ff; border: 1px solid #c7d2fe; border-radius: 0.5rem; cursor: pointer; color: #4f46e5; flex-shrink: 0; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#c7d2fe'" onmouseout="this.style.backgroundColor='#e0e7ff'" title="Сканировать продукты через ИИ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </button>
                    
                    <!-- Выпадашка сортировки -->
                    <select id="sortSelect" class="adaptive-sort-select" onchange="setSortMode(this.value)" style="border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.4rem 0.5rem; font-size: 0.85rem; font-weight: 500; color: #475569; background-color: #f1f5f9; outline: none; cursor: pointer;">
                        <option value="classic">По расположению</option>
                        <option value="expiry">По сроку годности ⌛</option>
                        <option value="newest">По дате добавления 🆕</option>
                        <option value="alpha">По алфавиту 🔤</option>
                    </select>

                    <!-- Кнопка настроек полок -->
                    <button onclick="openSettingsModal()" id="tab-settings" class="tab-btn tab-inactive" style="display: flex; align-items: center; justify-content: center; padding: 0.4rem 0.5rem; background-color: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 0.5rem; cursor: pointer; color: #475569; flex-shrink: 0;" title="Настройка полок">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </header>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
            <div id="mainContainer" style="flex: 1; overflow-y: auto; padding: 6rem 1rem 6.5rem 1rem; box-sizing: border-box; max-height: calc(100vh - 4rem);"></div>
            <!-- Сюда JS добавит данные -->
        </main>

        <!-- ПЛАВАЮЩАЯ КНОПКА -->
        <div id="stickyAddBtn" class="floating-btn">
            <button onclick="openModal()" class="btn-plus">
                <span style="font-size: 2rem; line-height: 1; font-weight: 300;">+</span>
            </button>
        </div>
        <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
        <footer>
            <button id="navFridge" onclick="switchScreen('fridge')" class="nav-btn nav-active">
                <span style="font-size: 1.25rem;">🏠</span>
                <span>Холодильник</span>
            </button>
            <button id="navRecipes" onclick="switchScreen('recipes')" class="nav-btn nav-inactive">
                <span style="font-size: 1.25rem;">📖</span>
                <span>Рецепты</span>
            </button>
            <button id="navProfile" onclick="switchScreen('profile')" class="nav-btn nav-inactive">
                <span style="font-size: 1.25rem;">👤</span>
                <span>Профиль</span>
            </button>
        </footer>

        <!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ РЕЦЕПТА -->
        <div id="editRecipeModal" class="modal-overlay hidden">
            <div class="modal-content" style="display: flex !important; flex-direction: column !important; gap: 0.75rem !important; background-color: #ffffff; border-radius: 1rem; width: 100%; max-width: 24rem; padding: 1.5rem; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                    <h3 style="font-size: 1.125rem; font-weight: 700; margin: 0; color: #0f172a;">✏️ Редактировать рецепт</h3>
                </div>
                
                <!-- Изменение Названия -->
                <div style="display: flex !important; flex-direction: column !important; width: 100% !important; align-items: flex-start !important;">
                    <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Название блюда</label>
                    <input type="text" id="editRecName" class="form-input" style="width: 100% !important; display: block !important; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.625rem; box-sizing: border-box; font-size: 0.875rem;">
                </div>

                <!-- Контейнер для динамического списка ингредиентов -->
                <div style="display: flex !important; flex-direction: column !important; width: 100% !important; align-items: flex-start !important; margin-top: 0.25rem;">
                    <label class="form-label" style="display: block; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 0.25rem;">Ингредиенты</label>
                    <!-- Плавающий компактный контейнер подсказок для окна редактирования рецепта -->
                    <div id="recipeEditSuggestions" class="hidden" style="position: absolute; background: white; border: 1px solid #e2e8f0; width: 13.5rem; max-height: 10rem; overflow-y: auto; z-index: 999; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-radius: 0.5rem; margin-top: 1.85rem; box-sizing: border-box;"></div>
                    <div id="editRecipeIngredientsListContainer" style="display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-height: 10rem; overflow-y: auto; padding-right: 0.25rem; margin-bottom: 0.5rem;"></div>
                    
                    <button onclick="addIngredientRowToEditForm()" style="width: 100%; padding: 0.4rem; background-color: transparent; color: #4f46e5; border: 1px dashed #4f46e5; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600; cursor: pointer;">+ Добавить ингредиент</button>
                </div>

        </div>

    </div>

    <!-- АВТОНОМНЫЙ СКРИПТ ЛОГИКИ -->
    <script>
        const emojiMap = {
            'моло': '🥛', 'сливки': '🥛', 'сыр': '🧀', 'яйц': '🥚', 'томат': '🍅', 'помидор': '🍅',
            'яблок': '🍎', 'банан': '🍌', 'колбас': '🥩', 'мяс': '🥩', 'свинин': '🥩', 'говядин': '🥩',
            'рыб': '🐟', 'огуре': '🥒', 'лимон': '🍋', 'хлеб': '🍞', 'соус': '🥫', 'кетчуп': '🥫',
            'масло': '🧈', 'морожен': '🍦', 'пив': '🍺', 'вин': '🍷', 'сок': '🧃'
        };

        const getEmoji = (name) => {
            const cleanName = name.toLowerCase().trim();
            if (!cleanName) return '📦';
            
            // 1. ПРИОРИТЕТ: Сначала ищем в вашей кастомной базе из Профиля
            const catalogItem = userCatalog.find(item => item.name.toLowerCase().trim() === cleanName);
            if (catalogItem && catalogItem.emoji) return catalogItem.emoji;

            // 2. ГИБКИЙ ПОИСК ПО СТАНДАРТНОЙ КАРТЕ: Проверяем частичные совпадения в обе стороны
            for (const key in emojiMap) {
                const cleanKey = key.toLowerCase().trim();
                
                // Проверяем, входит ли ключ в название (например, ключ "огурец" входит в "огурцы")
                // ИЛИ входит ли название в ключ (например, имя "томат" входит в ключ "томаты")
                if (cleanName.includes(cleanKey) || cleanKey.includes(cleanName)) {
                    return emojiMap[key];
                }
            }
            
            return '📦';
        };
        
        let recipesDatabase = JSON.parse(localStorage.getItem('my_custom_recipes')) || [
            {
                id: 101,
                title: "Классический омлет",
                ingredients: [{ name: "Яйца", qty: 2 }, { name: "Молоко", qty: 1 }]
            },
            {
                id: 102,
                title: "Свежий салат",
                ingredients: [{ name: "Томаты", qty: 2 }, { name: "Огурец", qty: 1 }]
            },
            {
                id: 103,
                title: "Бутерброд с сыром",
                ingredients: [{ name: "Хлеб", qty: 1 }, { name: "Сыр", qty: 1 }]
            }
        ];

        // Динамическая двухуровневая структура полок: Группа -> Список полок внутри нее
        let groups = JSON.parse(localStorage.getItem('my_fridge_groups')) || [
            {
                id: 'g1',
                name: 'Холодильная камера',
                shelves: ['Верхняя полка', 'Средняя полка', 'Нижняя полка', 'Полки на двери']
            },
            {
                id: 'g3',
                name: 'Морозильная камера',
                shelves: ['Верхний ящик', 'Нижний ящик']
            }
        ];

        // Очистка локального кэша для применения новой структуры (Рекомендуется)
        if (localStorage.getItem('user_products_catalog') && !localStorage.getItem('user_products_catalog').includes('{')) { localStorage.removeItem('user_products_catalog'); }
        
        // АВТОМАТИЧЕСКАЯ САМООЧИСТКА: Защита от поломки базы данных у старых пользователей
        try {
            let testCatalog = JSON.parse(localStorage.getItem('user_products_catalog'));
            if (testCatalog && Array.isArray(testCatalog)) {
                let isCorrupted = false;
                
                // Проверяем каждую карточку товара в памяти устройства
                testCatalog.forEach(item => {
                    if (!item || !item.name) {
                        isCorrupted = true;
                    } else if (item.emoji && Array.from(item.emoji).length > 2) {
                        // Если в поле эмодзи просочился длинный текст (больше 2-х символов/суррогатных пар)
                        isCorrupted = true;
                    }
                });

                // Если база данных на устройстве пользователя повреждена — мягко сбрасываем её
                if (isCorrupted) {
                    console.warn("Обнаружены поврежденные данные в каталоге! Сбрасываем базу по умолчанию...");
                    localStorage.removeItem('user_products_catalog');
                }
            }
        } catch (e) {
            // Если localStorage вообще хранит не JSON и падает при чтении — очищаем его полностью
            localStorage.removeItem('user_products_catalog');
        }
        
        // Переводим каталог на структуру объектов (Имя + Эмодзи)
        let userCatalog = JSON.parse(localStorage.getItem('user_products_catalog')) || [
            { name: 'Молоко', emoji: '🥛', defaultDays: 3 },
            { name: 'Томаты', emoji: '🍅', defaultDays: 7 },
            { name: 'Сыр', emoji: '🧀', defaultDays: 5 },
            { name: 'Яйцо', emoji: '🥚', defaultDays: 12 },
            { name: 'Соус', emoji: '🥫', defaultDays: 30 },
            { name: 'Кетчуп', emoji: '🥫', defaultDays: 30 },
            { name: 'Хлеб', emoji: '🍞', defaultDays: 4 },
            { name: 'Огурец', emoji: '🥒', defaultDays: 6 },
            { name: 'Яблоко', emoji: '🍏', defaultDays: 10 },
            { name: 'Апельсин', emoji: '🍊', defaultDays: 10 },
            { name: 'Рыба', emoji: '🐟', defaultDays: 3 },
            { name: 'Банан', emoji: '🍌', defaultDays: 10 },
        ];

        function addToCatalog(name) {
            const cleanName = name.charAt(0).toUpperCase() + name.slice(1).trim();
            if (!cleanName) return;
            
            const exists = userCatalog.some(item => item.name.toLowerCase() === cleanName.toLowerCase());
            if (!exists) {
                userCatalog.push({
                    name: cleanName,
                    emoji: getEmoji(cleanName),
                    defaultDays: 5 // Для новых уникальных продуктов по умолчанию ставим 5 дней
                });
                userCatalog.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
                localStorage.setItem('user_products_catalog', JSON.stringify(userCatalog));
            }
        }

        // ЧЁТКАЯ ПРАВКА: Инициализируем стартовые продукты с ПРАВИЛЬНЫМ временем создания текущего момента
        let products = JSON.parse(localStorage.getItem('my_fridge_items'));
        if (!products) {
            const now = Date.now();
            products = [
                { id: now + 1, name: 'Молоко', qty: 2, shelf: 'Верхняя полка', initialDays: 3, daysLeft: 3, createdAt: now },
                { id: now + 2, name: 'Томаты', qty: 5, shelf: 'Нижняя полка', initialDays: 7, daysLeft: 7, createdAt: now },
                { id: now + 3, name: 'Сыр', qty: 1, shelf: 'Средняя полка', initialDays: 1, daysLeft: 1, createdAt: now },
                { id: now + 4, name: 'Яйца', qty: 10, shelf: 'Средняя полка', initialDays: 12, daysLeft: 12, createdAt: now },
                { id: now + 5, name: 'Соус', qty: 1, shelf: 'Полки на двери', initialDays: 30, daysLeft: 30, createdAt: now }
            ];
        }

        // Настройки дней для окрашивания (по умолчанию 1 и 3)
        let expiryRedDays = parseInt(localStorage.getItem('my_fridge_red_days')) || 1;
        let expiryOrangeDays = parseInt(localStorage.getItem('my_fridge_orange_days')) || 3;
        // Полноценные массивы для хранения истории действий (Отмена / Повтор)
        let undoStack = [];
        let redoStack = [];
        let currentScreen = 'fridge';
        let currentMode = 'classic';
        let historyUndo = [];
        let historyRedo = [];

        function saveState() {
            historyUndo.push(JSON.stringify(products));
            if (historyUndo.length > 20) historyUndo.shift();
            historyRedo = []; 
            updateHistoryButtons();
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
        }

        function undo() {
            if (historyUndo.length === 0) return;
            historyRedo.push(JSON.stringify(products));
            products = JSON.parse(historyUndo.pop());
            updateHistoryButtons();
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

        function redo() {
            if (historyRedo.length === 0) return;
            historyUndo.push(JSON.stringify(products));
            products = JSON.parse(historyRedo.pop());
            updateHistoryButtons();
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

        // Функция сохранения текущего слепка холодильника перед изменением
        function saveState() {
            if (!products) return;
            // Делаем глубокий снимок текущего массива продуктов и отправляем в стопку отмены
            undoStack.push(JSON.stringify(products));
            // При новом действии пользователя стопка "Вперед" (Повторить) всегда очищается
            redoStack = [];
            updateHistoryButtons();
        }

        // ОТМЕНА ДЕЙСТВИЯ (Назад / Ctrl+Z)
        function undo() {
            if (undoStack.length === 0) return;
            
            // Запоминаем текущее состояние в стопку повтора на случай, если пользователь передумает
            redoStack.push(JSON.stringify(products));
            
            // Достаем последний снимок из истории отмены и восстанавливаем его
            const prevState = undoStack.pop();
            products = JSON.parse(prevState);
            
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            updateHistoryButtons();
            render();
        }

        // ПОВТОР ДЕЙСТВИЯ (Вперед / Ctrl+Y)
        function redo() {
            if (redoStack.length === 0) return;
            
            // Возвращаем снимок в историю отмены
            undoStack.push(JSON.stringify(products));
            
            // Достаем слепок из стопки повтора
            const nextState = redoStack.pop();
            products = JSON.parse(nextState);
            
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            updateHistoryButtons();
            render();
        }

        function updateHistoryButtons() {
            const undoB = document.getElementById('undoBtn');
            const redoB = document.getElementById('redoBtn');
            
            // ЖЕСТКАЯ ПОДСТРАХОВКА: Если кнопок нет на текущем экране, просто выходим без ошибок в консоли
            if (!undoB || !redoB) return;

            undoB.disabled = undoStack.length === 0;
            if (undoStack.length === 0) undoB.classList.add('opacity-50');
            else undoB.classList.remove('opacity-50');

            redoB.disabled = redoStack.length === 0;
            if (redoStack.length === 0) redoB.classList.add('opacity-50');
            else redoB.classList.remove('opacity-50');
        }

        function switchScreen(screen) {
            currentScreen = screen;
            const title = document.getElementById('appTitle');
            const filterBar = document.getElementById('filterBar');
            const addBtn = document.getElementById('stickyAddBtn');
            const navFridge = document.getElementById('navFridge');
            const navRecipes = document.getElementById('navRecipes');
            const navProfile = document.getElementById('navProfile');

            // Сбрасываем стили у всех кнопок навигации в нижнем меню
            [navFridge, navRecipes, navProfile].forEach(btn => {
                if (btn) { btn.className = "nav-btn nav-inactive"; }
            });

            if (screen === 'fridge') {
                if (title) title.innerHTML = '<span>❄️</span> Холодильник';
                if (filterBar) filterBar.classList.remove('hidden'); // Безопасный вызов
                if (addBtn) addBtn.classList.remove('hidden');
                if (navFridge) navFridge.className = "nav-btn nav-active";
            } else if (screen === 'recipes') {
                if (title) title.innerHTML = '<span>📖</span> Книга рецептов';
                if (filterBar) filterBar.classList.add('hidden');    // Безопасный вызов
                if (addBtn) addBtn.classList.remove('hidden');
                if (navRecipes) navRecipes.className = "nav-btn nav-active";
            } else if (screen === 'profile') {
                if (title) title.innerHTML = '<span>👤</span> База продуктов';
                if (filterBar) filterBar.classList.add('hidden');    // Безопасный вызов
                if (addBtn) addBtn.classList.add('hidden'); // Скрываем синий плюс в профиле
                if (navProfile) navProfile.className = "nav-btn nav-active";
            } else if (screen === 'settings') {
                if (title) title.innerHTML = '<span>⚙️</span> Настройка полок';
                if (filterBar) filterBar.classList.add('hidden');    // Безопасный вызов
                if (addBtn) addBtn.classList.add('hidden');
            }
            render();
        }

        function render() {
            const container = document.getElementById('mainContainer');
            if (!container) return;
            container.innerHTML = '';
            
            if (currentScreen === 'fridge') { renderFridge(container); } 
            else if (currentScreen === 'recipes') { renderRecipes(container); }
            else if (currentScreen === 'profile') { renderProfileCatalog(container); } // Подключаем отрисовку профиля
            else if (currentScreen === 'settings') { renderSettings(container); }
        }

        function renderFridge(container) {
            let displayItems = JSON.parse(JSON.stringify(products));
            
            // АВТОМАТИЧЕСКИЙ ПЕРЕСЧЕТ СРОКОВ ГОДНОСТИ С ТЕЧЕНИЕМ ВРЕМЕНИ
            displayItems.forEach(item => {
                // Если у старых продуктов нет даты создания (createdAt), создаем её текущим моментом
                if (!item.createdAt) {
                    item.createdAt = item.id;
                    item.initialDays = item.daysLeft;
                }
                
                // Высчитываем, сколько миллисекунд прошло с момента добавления продукта до текущей секунды
                const msPassed = Date.now() - item.createdAt;
                
                // Переводим миллисекунды в полные дни (1 день = 24 * 60 * 60 * 1000 мс)
                const daysPassed = Math.floor(msPassed / (1000 * 60 * 60 * 24));
                
                // Вычитаем прошедшие дни из первоначального срока годности
                item.daysLeft = item.initialDays - daysPassed;
            });

            // ЧЁТКАЯ ПРАВКА: Если выбран режим "По расположению" (classic), мы рисуем сгруппированные зоны и полки
            // В режиме "По расположению" (classic) выводим полки напрямую в контейнер без серых плашек
            if (currentMode === 'classic') {
                groups.forEach(group => {
                    // Создаем только лаконичный заголовок зоны
                    const titleDiv = document.createElement('div');
                    titleDiv.style.margin = '1rem 0 0.5rem 0';
                    titleDiv.innerHTML = `<h3 style="font-size: 0.85rem; font-weight: 800; color: #4f46e5; margin: 0; text-transform: uppercase; letter-spacing: 0.05em;">${group.name}</h3>`;
                    container.appendChild(titleDiv);
                    
                    // Выводим полки этой зоны напрямую в главный контейнер
                    group.shelves.forEach(shelfName => {
                        const shelfItems = displayItems.filter(item => item.shelf === shelfName);
                        
                        const shelfDiv = document.createElement('div');
                        shelfDiv.className = 'shelf-section';
                        shelfDiv.style.marginBottom = '0.75rem'; // Минимальный компактный отступ между полками
                        shelfDiv.innerHTML = `
                            <h4 class="shelf-title" style="color: #64748b; font-size: 0.75rem; margin-bottom: 0.25rem;">${shelfName}</h4>
                            <div class="shelf-border" data-shelf="${shelfName}" ondragover="event.preventDefault(); this.classList.add('shelf-hover');" ondragleave="this.classList.remove('shelf-hover');" ondrop="handleProductDrop(event, '${shelfName}')">
                                ${shelfItems.length === 0 ? '<span class="empty-shelf">Полка пуста</span>' : ''}
                            </div>
                        `;
                        const shelfList = shelfDiv.querySelector('.shelf-border');
                        shelfItems.forEach(item => { shelfList.appendChild(createProductCard(item)); });
                        container.appendChild(shelfDiv);
                    });
                });
            }
             else {
                // ИНАЧЕ: Если выбраны Срок, Алфавит или Дата — мы применяем сортировку КО ВСЕМ продуктам сразу
                if (currentMode === 'expiry') { displayItems.sort((a, b) => a.daysLeft - b.daysLeft); } 
                else if (currentMode === 'alpha') { displayItems.sort((a, b) => a.name.localeCompare(b.name, 'ru')); } // Сортировка с поддержкой русского языка
                else if (currentMode === 'newest') { displayItems.sort((a, b) => b.id - a.id); }

                // Отрисовываем отсортированные продукты в красивый гибкий флекс-ряд
                const listDiv = document.createElement('div');
                listDiv.className = 'list-grid';
                displayItems.forEach(item => { listDiv.appendChild(createProductCard(item)); });
                container.appendChild(listDiv);
            }
        }

        function createProductCard(item) {
            const card = document.createElement('div');
            
            // Динамически определяем степень критичности срока годности на основе настроек
            const isSpoiled = item.daysLeft <= 0; 
            const isRed = !isSpoiled && item.daysLeft <= expiryRedDays;
            const isOrange = !isSpoiled && !isRed && item.daysLeft <= expiryOrangeDays;
            
            let cardClass = 'product-card';
            if (isSpoiled) cardClass += ' product-spoiled';
            else if (isRed) cardClass += ' product-expiring';
            else if (isOrange) cardClass += ' product-warning';
            
            card.className = cardClass;
            card.setAttribute('data-id', String(item.id));
            
            // НАСТРОЙКА DRAG & DROP ДЛЯ ПК (HTML5)
            card.draggable = true;
            card.addEventListener('dragstart', (e) => {
                onDragStart(e, String(item.id));
            });
            card.addEventListener('dragend', onDragEnd);
            
            // НАСТРОЙКА DRAG & DROP ДЛЯ МОБИЛЬНЫХ ТЕЛЕФОНОВ (С защитой от скролла и залипаний)
            card.addEventListener('touchstart', (e) => {
                onTouchStart(e, String(item.id));
            }, { passive: true });
            
            card.addEventListener('touchmove', (e) => {
                // Если мы действительно тащим карточку — блокируем системный скролл экрана телефона
                if (touchDraggedCard) {
                    if (e.cancelable) event.preventDefault();
                }
                onTouchMove(e);
            }, { passive: false });
            
            card.addEventListener('touchend', onTouchEnd);
            
            // Обычный клик для открытия модального окна деталей
            card.onclick = () => {
                if (!isRealDrag) openProductDetailsModal(item.id);
            };
            
            // Настраиваем правый текстовый блок (дни или наклейка)
            let daysHTML = '';
            if (isSpoiled) {
                daysHTML = '<div class="spoiled-sticker">ИСПОРЧЕНО</div>';
            } else {
                let daysClass = 'product-days';
                if (isRed) daysClass += ' text-rose';
                if (isOrange) daysClass += ' text-orange';
                daysHTML = '<span class="' + daysClass + '">' + item.daysLeft + ' дн.</span>';
            }

            // Рендерим бейдж количества
            let badgeHTML = '';
            if (item.qty > 1) {
                badgeHTML = '<span class="product-badge">' + item.qty + '</span>';
            }

            card.innerHTML = `
                <span class="product-emoji" style="font-size: 1.4rem; line-height: 1; margin-top: 0.15rem;">${getEmoji(item.name)}</span>
                <span class="product-name" style="font-size: 0.675rem; font-weight: 600; color: #334155; display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; padding: 0 0.1rem; box-sizing: border-box;">${item.name}</span>
                ${badgeHTML}
                <div style="margin-top: auto; display: flex; justify-content: center; width: 100%; align-items: center; padding-bottom: 0.1rem; z-index: 6;">
                    ${daysHTML}
                </div>
            `;
            return card;
        }

        function renderRecipes(container) {
            const listDiv = document.createElement('div');
            recipesDatabase.forEach(recipe => {
                let canCook = true;
                let missingIngredients = 0;
                const ingStatus = recipe.ingredients.map(ing => {
                    // ИСПРАВЛЕННЫЙ ВАРИАНТ: Считаем сумму без дублирования переменных
                    const totalInFridge = products
                        .filter(p => p.name.toLowerCase().trim() === ing.name.toLowerCase().trim())
                        .reduce((sum, p) => sum + p.qty, 0);
                    
                    const isEnough = totalInFridge >= ing.qty;
                    if (!isEnough) { canCook = false; missingIngredients++; }
                    
                    return { ...ing, available: totalInFridge, ok: isEnough };
                    
                    const hasEnough = inFridge >= ing.qty;
                    if (!hasEnough) { canCook = false; missingIngredients++; }
                    return { ...ing, available: inFridge, ok: hasEnough };
                });

                const card = document.createElement('div');
                card.onclick = () => openEditRecipeModal(recipe.id);
                card.style.cursor = 'pointer'; // Делаем карточку явно кликабельной
                card.className = `recipe-card ${canCook ? 'recipe-cookable' : ''}`;
                let ingredientsHTML = ingStatus.map(ing => {
                    // Фильтруем все карточки этого продукта в холодильнике
                    const matchedProducts = products.filter(p => p.name.toLowerCase().trim() === ing.name.toLowerCase().trim());
                    
                    // Считаем общее количество продукта
                    const totalInFridge = matchedProducts.reduce((sum, p) => sum + p.qty, 0);
                    
                    // Считаем, сколько из них уже испорчено (срок 0 или меньше дней)
                    const spoiledQty = matchedProducts.filter(p => p.daysLeft <= 0).reduce((sum, p) => sum + p.qty, 0);
                    
                    const isEnough = totalInFridge >= ing.qty;

                    // Настраиваем надпись предупреждения о просрочке
                    let spoiledText = '';
                    if (spoiledQty > 0) {
                        spoiledText = ' <span style="color: #ef4444; font-weight: 700; font-size: 0.75rem; background-color: #fef2f2; padding: 0.1rem 0.3rem; border-radius: 0.25rem; border: 1px solid #fca5a5; margin-left: 0.35rem;">испорчено ' + spoiledQty + ' шт.</span>';
                    }

                    return `
                        <div class="ingredient-row" style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.25rem 0;">
                            <span class="${isEnough ? 'ing-name-ok' : 'ing-name-missing'}" style="font-size: 0.85rem;">
                                ${getEmoji(ing.name)} ${ing.name} (${ing.qty} шт.)${spoiledText}
                            </span>
                            <span class="${isEnough ? 'ing-status-ok' : 'ing-status-missing'}" style="font-size: 0.85rem; font-weight: 700;">
                                ${isEnough ? '✓' : 'Мало (есть ' + totalInFridge + ')'}
                            </span>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="recipe-header">
                        <div>

        function cookRecipe(recipeId) {
            const recipe = recipesDatabase.find(r => r.id === recipeId);
            if (!recipe) return;

            // Сохраняем состояние для возможности отмены через Undo (Ctrl+Z)
            saveState();

            // Идём по каждому ингредиенту в рецепте
            recipe.ingredients.forEach(ing => {
                let neededQty = ing.qty; // Сколько штук нам нужно списать
                const targetName = ing.name.toLowerCase().trim();

                // Пробегаемся по продуктам в холодильнике и списываем их
                for (let i = 0; i < products.length; i++) {
                    if (products[i].name.toLowerCase().trim() === targetName) {
                        if (products[i].qty > neededQty) {
                            // Если на полке лежит БОЛЬШЕ, чем нужно для рецепта — просто уменьшаем количество
                            products[i].qty -= neededQty;
                            neededQty = 0;
                        } else {
                            // Если на полке лежит МЕНЬШЕ или РОВНО столько, сколько нужно — забираем всё под ноль
                            neededQty -= products[i].qty;
                            products[i].qty = 0;
                        }
                    }
                    // Если мы полностью набрали нужное количество ингредиента, переходим к следующему
                    if (neededQty === 0) break;
                }
            });

            // Полностью удаляем из холодильника карточки тех продуктов, у которых количество стало 0
            products = products.filter(p => p.qty > 0);

            // Сохраняем обновленный массив в локальную память телефона
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            
            // Выводим красивое уведомление
            alert(`Блюдо "${recipe.title}" успешно приготовлено! Продукты автоматически списаны с полок.`);
            
            // Мгновенно обновляем интерфейс
            render();
        }

        function addProduct() {
            const nameInput = document.getElementById('prodName');
            let rawName = nameInput.value.trim();
            if (!rawName) return alert('Напишите название продукта!');
            
            // Превращаем первую букву в заглавную, а остальные оставляем как есть
            const name = rawName.charAt(0).toUpperCase() + rawName.slice(1);
            
            // Сохраняем имя в глобальный словарь пользователя
            addToCatalog(name); 
            
            const qty = parseInt(document.getElementById('prodQty').value) || 1;
            const shelf = selectedShelf;
            
            // Считываем то, что введено в инпут на экране
            let daysLeft = parseInt(document.getElementById('prodDays').value);
            if (isNaN(daysLeft) || daysLeft < 0) daysLeft = 5;

            // УМНАЯ ПОДСТАНОВКА: Если этот продукт есть в базе Профиля, берем его персональный срок
            const matchedCatalog = userCatalog.find(c => c.name.toLowerCase().trim() === name.toLowerCase().trim());
            if (matchedCatalog && matchedCatalog.defaultDays !== undefined) {
                daysLeft = matchedCatalog.defaultDays;
            }

            saveState();
            
            // Ищем совпадение по имени, полке И сроку годности одновременно
            const existing = products.find(p => 
                p.name.toLowerCase() === name.toLowerCase() && 
                p.shelf === shelf &&
                p.daysLeft === daysLeft
            );

            if (existing) { 
                existing.qty += qty; 
            } else { 
                products.push({ 
                    id: "ai_" + now + "_" + Math.floor(Math.random() * 100000),
                    name, 
                    qty, 
                    shelf, 
                    initialDays: daysLeft, // Запоминаем, сколько дней было изначально
                    createdAt: Date.now()  // Запоминаем точную дату добавления
                }); 
            }

            // Очищаем поля и возвращаем дефолтные настройки для следующего открытия
            nameInput.value = '';
            document.getElementById('prodQty').value = '1';
            document.getElementById('prodDays').value = '5';
            
            closeModal();
            render();
        }

        function handleProductDrop(event, targetShelf) {
            event.preventDefault();
            const shelfElement = event.currentTarget;
            if (shelfElement) shelfElement.classList.remove('shelf-hover');

            const productId = parseInt(event.dataTransfer.getData('text/plain'));
            if (isNaN(productId)) return;

            const draggedProductIndex = products.findIndex(p => p.id === productId);
            if (draggedProductIndex === -1) return;

            // Запоминаем текущий перетаскиваемый продукт
            const draggedProduct = products[draggedProductIndex];
            
            saveState();

            // ЧЁТКАЯ ПРАВКА ДЛЯ МОБИЛЬНЫХ: Определяем элемент под пальцем в момент сброса
            let targetCard = event.target.closest('.product-card');
            if (!targetCard && event.changedTouches && event.changedTouches.length > 0) {
                const touch = event.changedTouches[0];
                const elementAtTouch = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elementAtTouch) targetCard = elementAtTouch.closest('.product-card');
            }

            let targetItemId = null;
            if (targetCard) {
                targetItemId = parseInt(targetCard.getAttribute('data-id'));
            }

            // Ищем дубликат: строго по имени, целевой полке и СОВПАДАЮЩЕЙ дате создания (или сроку)
            const duplicateIndex = products.findIndex(p => 
                p.id !== productId &&
                p.name.toLowerCase().trim() === draggedProduct.name.toLowerCase().trim() && 
                p.shelf === targetShelf &&
                p.createdAt === draggedProduct.createdAt // Объединяем, только если это абсолютно одинаковые партии
            );

            if (duplicateIndex !== -1) {
                // Если бросили на точно такую же партию — просто суммируем количество
                products[duplicateIndex].qty += draggedProduct.qty;
                products.splice(draggedProductIndex, 1);
            } else {
                // ИНАЧЕ: Переносим на новую полку, ЖЕСТКО сохраняя все временные метки продукта!
                draggedProduct.shelf = targetShelf;
                
                // Вырезаем элемент из старого места в массиве
                products.splice(draggedProductIndex, 1);

                if (targetItemId && !isNaN(targetItemId)) {
                    // Если бросили на конкретный продукт — находим его индекс и вставляем прямо перед ним
                    let insertIndex = products.findIndex(p => p.id === targetItemId);
                    if (insertIndex !== -1) {
                        products.splice(insertIndex, 0, draggedProduct);
                    } else {
                        products.push(draggedProduct);
                    }
                } else {
                    // Если бросили просто на пустую область полки — отправляем в самый конец
                    products.push(draggedProduct);
                }
            }

            // Сохраняем и перерисовываем
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

        function saveProductDetails() {
            if (activeEditingProductId === null) return;
            const product = products.find(p => p.id === activeEditingProductId);
            if (!product) return;

            const nameInput = document.getElementById('detailsName').value.trim();
            if (!nameInput) return alert('Название не может быть пустым!');

            // Находим инпут дней по классу для 100% защиты на мобильных
            const daysInp = document.querySelector('.details-days-input');
            if (!daysInp) return alert('Ошибка: Поле ввода срока не найдено. Перезагрузите страницу.');

            const newDays = parseInt(daysInp.value);
            if (isNaN(newDays)) return alert('Введите корректное число дней!');

            saveState();
            
            product.name = nameInput.charAt(0).toUpperCase() + nameInput.slice(1);
            // ЧЁТКАЯ ПРАВКА: Если изменённое имя уникально, автоматически заносим его в глобальную базу Профиля
            addToCatalog(product.name);
            product.qty = parseInt(document.getElementById('detailsQty').value) || 1;
            product.shelf = detailsSelectedShelf;

            // ЧЁТКАЯ ПРАВКА: Если срок годности НЕ менялся, мы бережно храним старую дату добавления,
            // а если пользователь ввёл новую цифру дней — обновляем точку отсчета таймера
            if (product.daysLeft !== newDays) {
                product.initialDays = newDays;
                product.daysLeft = newDays;
                product.createdAt = Date.now(); 
            }

            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            closeProductDetailsModal();
            render();
        }

            const isOpenProd = sProd && !sProd.classList.contains('hidden');
            const isOpenDetails = sDetails && !sDetails.classList.contains('hidden');
            const isOpenRecAdd = sRecAdd && !sRecAdd.classList.contains('hidden');
            const isOpenRecEdit = sRecEdit && !sRecEdit.classList.contains('hidden');

            // --- НАВИГАЦИЯ СТРЕЛОЧКАМИ ПО ПОДСКАЗКАМ ---
            if ((isOpenProd || isOpenDetails || isOpenRecAdd || isOpenRecEdit) && (event.key === 'ArrowDown' || event.key === 'ArrowUp' || event.key === 'Enter')) {
                let activeContainer = sProd;
                let activeContainerId = 'customSuggestions';
                
                if (isOpenDetails) { activeContainer = sDetails; activeContainerId = 'productDetailsSuggestions'; }
                if (isOpenRecAdd) { activeContainer = sRecAdd; activeContainerId = 'recipeAddSuggestions'; }
                if (isOpenRecEdit) { activeContainer = sRecEdit; activeContainerId = 'recipeEditSuggestions'; }

                const items = activeContainer.querySelectorAll('div');
                
                if (items.length > 0) {
                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        currentSuggestionIndex++;
                        highlightSuggestion(activeContainerId);
                        return;
                    }
                    if (event.key === 'ArrowUp') {
                        event.preventDefault();
                        currentSuggestionIndex--;
                        highlightSuggestion(activeContainerId);
                        return;
                    }
                    if (event.key === 'Enter') {
                        if (currentSuggestionIndex >= 0 && currentSuggestionIndex < items.length) {
                            event.preventDefault();
                            items[currentSuggestionIndex].click(); // Выбираем пункт
                            return;
                        }
                    }
                }
            }

            // --- ГОРЯЧИЕ КЛАВИШИ ИСТОРИИ (Ctrl+Z и Ctrl+Y) ---
            if (event.ctrlKey && event.key.toLowerCase() === 'z') {
                event.preventDefault();
                undo();
                return;
            }
            if (event.ctrlKey && event.key.toLowerCase() === 'y') {
                event.preventDefault();
                redo();
                return;
            }

            // --- СТАНДАРТНОЕ ЗАКРЫТИЕ ПО ESCAPE ---
            if (event.key === 'Escape') {
                if (addModal && !addModal.classList.contains('hidden')) closeModal();
                if (detailsModal && !detailsModal.classList.contains('hidden')) closeProductDetailsModal();
                if (settingsModal && !settingsModal.classList.contains('hidden')) closeSettingsModal();
                if (recipeModal && !recipeModal.classList.contains('hidden')) closeAddRecipeModal();
                if (editRecModal && !editRecModal.classList.contains('hidden')) closeEditRecipeModal();
            }
            
            // --- СТАНДАРТНОЕ СОХРАНЕНИЕ ПО ENTER ---
            if (event.key === 'Enter') {
                if (addModal && !addModal.classList.contains('hidden')) { event.preventDefault(); addProduct(); }
                if (detailsModal && !detailsModal.classList.contains('hidden')) { event.preventDefault(); saveProductDetails(); }
                if (recipeModal && !recipeModal.classList.contains('hidden')) { event.preventDefault(); saveCustomRecipe(); }
                if (editRecModal && !editRecModal.classList.contains('hidden')) { event.preventDefault(); saveEditRecipeDetails(); }
            }
        });

        function validateExpirySettings(changedType) {
            const redInput = document.getElementById('settingRedDays');
            const orangeInput = document.getElementById('settingOrangeDays');
            if (!redInput || !orangeInput) return;

            let red = parseInt(redInput.value) || 0;
            let orange = parseInt(orangeInput.value) || 1;

            // ЖЁСТКОЕ UX-ОГРАНИЧЕНИЕ: Значение для красного цвета нельзя ввести больше или таким же как для оранжевого
            if (red >= orange) {
                if (changedType === 'red') {
                    // Если пользователь завысил красный, сбрасываем его на уровень ниже оранжевого
                    red = orange - 1;
                    if (red < 0) red = 0;
                    redInput.value = red;
                } else {
                    // Если пользователь занизил оранжевый, поднимаем его на уровень выше красного
                    orange = red + 1;
                    orangeInput.value = orange;
                }
            }

            // Сохраняем проверенные цифры в память и переменные
            expiryRedDays = red;
            expiryOrangeDays = orange;
            localStorage.setItem('my_fridge_red_days', red);
            localStorage.setItem('my_fridge_orange_days', orange);
            
            render(); // Мгновенно перекрашиваем холодильник на заднем плане
        }
