<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Холодильник — Преврати хаос в порядок!</title>
    <!-- Подключаем надежную и стабильную версию Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем иконки -->
    <script src="https://unpkg.com"></script>
    <style>
        .shelf { border-bottom: 8px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .product-card { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col justify-between relative pb-20">
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <h1 class="text-xl font-bold flex items-center gap-2 text-indigo-600">
                    <i data-lucide="refrigerator"></i> Холодильник
                </h1>
                <div class="flex gap-2">
                    <button id="btnUndo" onclick="undo()" class="p-2 rounded-full hover:bg-slate-100 disabled:opacity-30" disabled title="Отменить последнее действие">
                        <i data-lucide="undo-2" class="w-5 h-5"></i>
                    </button>
                    <button id="btnRedo" onclick="redo()" class="p-2 rounded-full hover:bg-slate-100 disabled:opacity-30" disabled title="Повторить отмененное действие">
                        <i data-lucide="redo-2" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-1 text-sm scrollbar-none">
                <button onclick="setMode('classic')" id="tab-classic" class="px-3 py-1.5 rounded-full bg-indigo-600 text-white font-medium whitespace-nowrap">Полки</button>
                <button onclick="setMode('expiry')" id="tab-expiry" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap">По сроку ⌛</button>
                <button onclick="setMode('alpha')" id="tab-alpha" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap">А-Я 🔤</button>
                <button onclick="toggleGroup()" id="tab-group" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap">Разгруппировать</button>
            </div>
        </header>

        <!-- ОСНОВНОЙ ХОЛОДИЛЬНИК -->
        <main class="flex-grow p-4 overflow-y-auto" id="fridgeContainer">
            <!-- Сюда JavaScript добавит полки с продуктами -->
        </main>

        <!-- КНОПКА ДЛЯ ДОБАВЛЕНИЯ -->
        <div class="absolute bottom-24 right-4 z-20">
            <button onclick="openModal()" class="w-14 h-14 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-lg flex items-center justify-center transition transform hover:scale-105">
                <i data-lucide="plus" class="w-8 h-8"></i>
            </button>
        </div>

        <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
        <footer class="bg-white border-t border-slate-200 p-3 grid grid-cols-3 text-center fixed bottom-0 w-full max-w-md shadow-lg z-10">
            <button class="flex flex-col items-center text-indigo-600 font-semibold">
                <i data-lucide="refrigerator" class="w-6 h-6"></i>
                <span class="text-xs mt-1">Холодильник</span>
            </button>
            <button onclick="alert('Книга рецептов находится в разработке!')" class="flex flex-col items-center text-slate-400 hover:text-slate-600">
                <i data-lucide="book-open" class="w-6 h-6"></i>
                <span class="text-xs mt-1">Рецепты</span>
            </button>
            <button onclick="alert('Функция совместного доступа будет добавлена на этапе подключения базы данных.')" class="flex flex-col items-center text-slate-400 hover:text-slate-600">
                <i data-lucide="users" class="w-6 h-6"></i>
                <span class="text-xs mt-1">Семья</span>
            </button>
        </footer>

        <!-- ОКНО ДОБАВЛЕНИЯ ТОВАРА -->
        <div id="addProductModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl transform transition-all">
                <h3 class="text-lg font-bold mb-4 text-slate-900">Добавить продукт</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Название продукта</label>
                        <input type="text" id="prodName" placeholder="Например: Молоко, Сыр, Томаты" class="w-full border border-slate-200 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Количество</label>
                            <input type="number" id="prodQty" value="1" min="1" class="w-full border border-slate-200 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Полка</label>
                            <select id="prodShelf" class="w-full border border-slate-200 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500">
                                <option value="Верхняя">Верхняя</option>
                                <option value="Средняя">Средняя</option>
                                <option value="Нижняя">Нижняя</option>
                                <option value="Дверца">Дверца</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Срок годности (осталось дней)</label>
                        <input type="number" id="prodDays" value="5" min="0" class="w-full border border-slate-200 rounded-lg p-2.5 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="flex gap-3 mt-6">
                        <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium rounded-lg text-sm">Отмена</button>
                        <button onclick="addProduct()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm">Добавить</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ВНУТРЕННЯЯ ЛОГИКА ПРИЛОЖЕНИЯ -->
    <script>
        const emojiMap = {
            'молоко': '🥛', 'сыр': '🧀', 'яйца': '🥚', 'томаты': '🍅', 'помидор': '🍅', 'помидоры': '🍅',
            'яблоко': '🍎', 'яблоки': '🍎', 'банан': '🍌', 'бананы': '🍌', 'колбаса': '🥩', 'мясо': '🥩', 
            'рыба': '🐟', 'огурец': '🥒', 'огурцы': '🥒', 'лимон': '🍋', 'хлеб': '🍞', 'соус': '🥫', 'кетчуп': '🥫'
        };

        let products = JSON.parse(localStorage.getItem('my_fridge_items')) || [
            { id: 1, name: 'Молоко', qty: 2, shelf: 'Верхняя', daysLeft: 3 },
            { id: 2, name: 'Томаты', qty: 5, shelf: 'Нижняя', daysLeft: 7 },
            { id: 3, name: 'Сыр', qty: 1, shelf: 'Средняя', daysLeft: 1 },
            { id: 4, name: 'Яйца', qty: 10, shelf: 'Средняя', daysLeft: 12 },
            { id: 5, name: 'Соус', qty: 1, shelf: 'Дверца', daysLeft: 30 }
        ];

        let currentMode = 'classic';
        let isGrouped = true;

        let historyUndo = [];
        let historyRedo = [];

        function saveState() {
            historyUndo.push(JSON.stringify(products));
            if (historyUndo.length > 20) historyUndo.shift();
            historyRedo = []; 
            updateHistoryButtons();
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
        }

        function undo() {
            if (historyUndo.length === 0) return;
            historyRedo.push(JSON.stringify(products));
            products = JSON.parse(historyUndo.pop());
            updateHistoryButtons();
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

        function redo() {
            if (historyRedo.length === 0) return;
            historyUndo.push(JSON.stringify(products));
            products = JSON.parse(historyRedo.pop());
            updateHistoryButtons();
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            render();
        }

        function updateHistoryButtons() {
            document.getElementById('btnUndo').disabled = historyUndo.length === 0;
            document.getElementById('btnRedo').disabled = historyRedo.length === 0;
        }

        function getEmoji(name) {
            const cleanName = name.toLowerCase().trim();
            return emojiMap[cleanName] || '📦';
        }

        function render() {
            const container = document.getElementById('fridgeContainer');
            container.innerHTML = '';

            let displayItems = [];
            if (isGrouped) {
                displayItems = JSON.parse(JSON.stringify(products));
            } else {
                products.forEach(p => {
                    for(let i = 0; i < p.qty; i++) {
                        displayItems.push({...p, qty: 1});
                    }
                });
            }

            if (currentMode === 'classic') {
                const shelves = ['Верхняя', 'Средняя', 'Нижняя', 'Дверца'];
shelves.forEach(shelfName => {const shelfItems = displayItems.filter(item => item.shelf === shelfName);const shelfDiv = document.createElement('div');shelfDiv.className = 'mb-6';shelfDiv.innerHTML = <h4 class="text-xs font-bold text-slate-400 mb-2 px-1 uppercase tracking-wider">${shelfName} полка</h4> <div class="shelf min-h-[96px] bg-slate-50/60 rounded-t-xl p-3 flex flex-wrap gap-4 items-end"> ${shelfItems.length === 0 ? '<span class="text-xs text-slate-300 italic self-center mx-auto my-auto py-4">Полка пуста</span>' : ''} </div>;const shelfList = shelfDiv.querySelector('.shelf');shelfItems.forEach(item => {shelfList.appendChild(createProductCard(item));});container.appendChild(shelfDiv);});} else {if (currentMode === 'expiry') {displayItems.sort((a, b) => a.daysLeft - b.daysLeft);} else if (currentMode === 'alpha') {displayItems.sort((a, b) => a.name.localeCompare(b.name));}const listDiv = document.createElement('div');listDiv.className = 'grid grid-cols-4 gap-4 p-2';displayItems.forEach(item => {listDiv.appendChild(createProductCard(item));});container.appendChild(listDiv);}lucide.createIcons();}function createProductCard(item) {const card = document.createElement('div');card.className = 'product-card relative flex flex-col items-center bg-white border border-slate-200 rounded-xl p-2 cursor-pointer shadow-sm hover:shadow-md hover:-translate-y-0.5 w-16';if (item.daysLeft <= 1) {card.classList.add('bg-rose-50', 'border-rose-300');}card.onclick = () => removeProduct(item.id);card.innerHTML = <span class="text-3xl mb-1 select-none">${getEmoji(item.name)}</span> <span class="text-[10px] text-center font-medium truncate w-full text-slate-700">${item.name}</span> ${item.qty > 1 && isGrouped ?${item.qty}: ''} <span class="text-[8px] mt-0.5 ${item.daysLeft <= 1 ? 'text-rose-600 font-bold' : 'text-slate-400 font-semibold'}">${item.daysLeft} дн.</span>;return card;}function setMode(mode) {currentMode = mode;['classic', 'expiry', 'alpha'].forEach(m => {const btn = document.getElementById(tab-${m});btn.className = (m === mode)? "px-3 py-1.5 rounded-full bg-indigo-600 text-white font-medium whitespace-nowrap": "px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap";});render();}function toggleGroup() {isGrouped = !isGrouped;const btn = document.getElementById('tab-group');btn.textContent = isGrouped ? 'Разгруппировать' : 'Сгруппировать';btn.className = isGrouped? "px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap": "px-3 py-1.5 rounded-full bg-amber-500 text-white font-medium whitespace-nowrap";render();}function removeProduct(id) {saveState();const index = products.findIndex(p => p.id === id);if (index !== -1) {if (products[index].qty > 1) {products[index].qty -= 1;} else {products.splice(index, 1);}}localStorage.setItem('my_fridge_items', JSON.stringify(products));render();}function openModal() { document.getElementById('addProductModal').classList.remove('hidden'); }function closeModal() { document.getElementById('addProductModal').classList.add('hidden'); }function addProduct() {const nameInput = document.getElementById('prodName');const name = nameInput.value.trim();const qty = parseInt(document.getElementById('prodQty').value) || 1;const shelf = document.getElementById('prodShelf').value;const daysLeft = parseInt(document.getElementById('prodDays').value) || 5;if (!name) return alert('Пожалуйста, напишите название продукта!');saveState();const existing = products.find(p => p.name.toLowerCase() === name.toLowerCase() && p.shelf === shelf);if (existing) {existing.qty += qty;} else {products.push({ id: Date.now(), name, qty, shelf, daysLeft });}nameInput.value = '';document.getElementById('prodQty').value = '1';document.getElementById('prodDays').value = '5';closeModal();localStorage.setItem('my_fridge_items', JSON.stringify(products));render();}render();
