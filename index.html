                    <input type="number" value="1" min="1" class="rec-ing-qty" style="width: 2rem; height: 100%; border: none; text-align: center; font-size: 0.8rem; font-weight: 600; color: #334155; outline: none; -moz-appearance: textfield;">
                    <button onclick="let inp = this.previousElementSibling; let v = parseInt(inp.value)||1; inp.value=v+1;" style="width: 1.5rem; height: 100%; background: #f8fafc; border: none; font-size: 1rem; font-weight: 600; color: #64748b; cursor: pointer;">+</button>
                </div>
                <button onclick="this.parentElement.remove()" style="background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 0.25rem 0.5rem;" title="Удалить ингредиент">✕</button>
            `;
            container.appendChild(row);
            
            // АВТОФОКУС: находим инпут в только что добавленной строке и ставим туда курсор
            const newInp = row.querySelector('.rec-ing-name');
            if (newInp) newInp.focus();
        }

        function validateRecipeIngredients(rowClassName, inputClassName) {
            const rows = document.querySelectorAll('.' + rowClassName);
            const namesSeen = {};
            let hasDuplicates = false;

            // Сначала собираем информацию о том, какие имена сколько раз встречаются
            rows.forEach(row => {
                const nameInp = row.querySelector('.' + inputClassName);
                if (nameInp) {
                    const name = nameInp.value.trim().toLowerCase();
                    if (name) {
                        namesSeen[name] = (namesSeen[name] || 0) + 1;
                    }
                }
            });

            // Красим инпуты: если имя встречается больше 1 раза — делаем его красным
            rows.forEach(row => {
                const nameInp = row.querySelector('.' + inputClassName);
                if (nameInp) {
                    const name = nameInp.value.trim().toLowerCase();
                    if (name && namesSeen[name] > 1) {
                        nameInp.style.borderColor = '#ef4444';
                        nameInp.style.backgroundColor = '#fef2f2';
                        hasDuplicates = true;
                    } else {
                        // Возвращаем стандартный цвет, если всё в порядке
                        nameInp.style.borderColor = '#e2e8f0';
                        nameInp.style.backgroundColor = '#ffffff';
                    }
                }
            });

            return hasDuplicates;
        }

        function saveCustomRecipe() {
            if (validateRecipeIngredients('form-ingredient-row', 'rec-ing-name')) {
                return alert('В рецепте есть одинаковые ингредиенты! Пожалуйста, измените или удалите дубликаты.');
            }
            
            const titleInput = document.getElementById('recName');
            let rawTitle = titleInput.value.trim();
            if (!rawTitle) return alert('Напишите название блюда!');

            // Делаем первую букву названия заглавной
            const title = rawTitle.charAt(0).toUpperCase() + rawTitle.slice(1);

            const rows = document.querySelectorAll('.form-ingredient-row');
            const ingredients = [];

            // Собираем данные из всех динамических строчек формы
            rows.forEach(row => {
                const nameInp = row.querySelector('.rec-ing-name');
                const qtyInp = row.querySelector('.rec-ing-qty');
                
                if (nameInp && qtyInp) {
                    let rawIngName = nameInp.value.trim();
                    let ingQty = parseInt(qtyInp.value) || 1;
                    
                    if (rawIngName) {
                        // Капитализируем имя ингредиента, чтобы оно идеально матчилось с продуктами
                        const ingName = rawIngName.charAt(0).toUpperCase() + rawIngName.slice(1);
                        ingredients.push({ name: ingName, qty: ingQty });
                    }
                }
            });

            if (ingredients.length === 0) {
                return alert('Добавьте хотя бы один ингредиент к рецепту!');
            }

            // Добавляем новый рецепт в массив
            recipesDatabase.push({
                id: Date.now(), // Уникальный id на основе времени
                title: title,
                ingredients: ingredients
            });

            // Сохраняем базу в память смартфона и обновляем интерфейс
            localStorage.setItem('my_custom_recipes', JSON.stringify(recipesDatabase));
            closeAddRecipeModal();
            render();
        }

        let activeEditingRecipeId = null;

        function openEditRecipeModal(id) {
            const recipe = recipesDatabase.find(r => r.id === id);
            if (!recipe) return;

            activeEditingRecipeId = id;
            document.getElementById('editRecName').value = recipe.title;
            
            const container = document.getElementById('editRecipeIngredientsListContainer');
            if (container) {
                container.innerHTML = '';
                recipe.ingredients.forEach(ing => {
                    addIngredientRowToEditForm(ing.name, ing.qty);
                });
            }

            document.getElementById('editRecipeModal').classList.remove('hidden');
        }

        function closeEditRecipeModal() {
            document.getElementById('editRecipeModal').classList.add('hidden');
            document.getElementById('recipeEditSuggestions').classList.add('hidden');
            activeEditingRecipeId = null;
        }

        function addIngredientRowToEditForm(name = '', qty = 1) {
            const container = document.getElementById('editRecipeIngredientsListContainer');
            if (!container) return;

            const row = document.createElement('div');
            row.className = 'form-ingredient-row-edit';
            row.style.display = 'flex';
            row.style.gap = '0.5rem';
            row.style.alignItems = 'center';
            row.style.width = '100%';

            row.innerHTML = `
                <input type="text" placeholder="Ингредиент" oninput="validateRecipeIngredients('form-ingredient-row-edit', 'edit-rec-ing-name'); showRecipeEditSuggestions(this.value, this);" onclick="showRecipeEditSuggestions(this.value, this);" value="${name}" class="form-input edit-rec-ing-name" autocomplete="off" style="flex: 2; font-size: 0.8rem; padding: 0.4rem 0.5rem;">
                <div style="display: flex; align-items: center; border: 1px solid #e2e8f0; border-radius: 0.5rem; background: #ffffff; height: 2rem; box-sizing: border-box; overflow: hidden; flex-shrink: 0;">
                    <button onclick="let inp = this.nextElementSibling; let v = parseInt(inp.value)||1; if(v>1) inp.value=v-1;" style="width: 1.5rem; height: 100%; background: #f8fafc; border: none; font-size: 1rem; font-weight: 600; color: #64748b; cursor: pointer;">−</button>
                    <input type="number" value="${qty}" min="1" class="edit-rec-ing-qty" style="width: 2rem; height: 100%; border: none; text-align: center; font-size: 0.8rem; font-weight: 600; color: #334155; outline: none; -moz-appearance: textfield;">
                    <button onclick="let inp = this.previousElementSibling; let v = parseInt(inp.value)||1; inp.value=v+1;" style="width: 1.5rem; height: 100%; background: #f8fafc; border: none; font-size: 1rem; font-weight: 600; color: #64748b; cursor: pointer;">+</button>
                </div>
                <button onclick="this.parentElement.remove()" style="background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 0.25rem 0.5rem;" title="Удалить ингредиент">✕</button>
            `;
            container.appendChild(row);
            
            // АВТОФОКУС: находим инпут в только что добавленной строке редактирования
            const newInp = row.querySelector('.edit-rec-ing-name');
            if (newInp) newInp.focus();

        }

        function saveEditRecipeDetails() {
            if (validateRecipeIngredients('form-ingredient-row-edit', 'edit-rec-ing-name')) {
                return alert('В рецепте есть одинаковые ингредиенты! Пожалуйста, измените или удалите дубликаты.');
            }

            if (activeEditingRecipeId === null) return;
            const recipe = recipesDatabase.find(r => r.id === activeEditingRecipeId);
            if (!recipe) return;

            const titleInput = document.getElementById('editRecName');
            let rawTitle = titleInput.value.trim();
            if (!rawTitle) return alert('Название блюда не может быть пустым!');

            const title = rawTitle.charAt(0).toUpperCase() + rawTitle.slice(1);
            const rows = document.querySelectorAll('.form-ingredient-row-edit');
            const ingredients = [];

            rows.forEach(row => {
                const nameInp = row.querySelector('.edit-rec-ing-name');
                const qtyInp = row.querySelector('.edit-rec-ing-qty');
                
                if (nameInp && qtyInp) {
                    let rawIngName = nameInp.value.trim();
                    let ingQty = parseInt(qtyInp.value) || 1;
                    
                    if (rawIngName) {
                        const ingName = rawIngName.charAt(0).toUpperCase() + rawIngName.slice(1);
                        ingredients.push({ name: ingName, qty: ingQty });
                    }
                }
            });

            if (ingredients.length === 0) {
                return alert('Добавьте хотя бы один ингредиент к рецепту!');
            }

            recipe.title = title;
            recipe.ingredients = ingredients;

            localStorage.setItem('my_custom_recipes', JSON.stringify(recipesDatabase));
            closeEditRecipeModal();
            render();
        }

        function deleteRecipeFromDetails() {
            if (activeEditingRecipeId === null) return;
            if (!confirm('Вы действительно хотите удалить этот рецепт?')) return;

            recipesDatabase = recipesDatabase.filter(r => r.id !== activeEditingRecipeId);
            localStorage.setItem('my_custom_recipes', JSON.stringify(recipesDatabase));
            closeEditRecipeModal();
            render();
        }

        // --- СТРАНИЦА ПРОФИЛЯ: УПРАВЛЕНИЕ ГЛОБАЛЬНОЙ БАЗОЙ ТОВАРОВ ---
        function renderProfileCatalog(container) {
            const wrap = document.createElement('div');
            wrap.style.display = 'flex';
            wrap.style.flexDirection = 'column';
            wrap.style.gap = '1rem';

            const info = document.createElement('p');
            info.textContent = 'Это ваша глобальная база эталонных продуктов. Изменение имени здесь автоматически обновит продукт на полках и в рецептах.';
            info.style.fontSize = '0.85rem';
            info.style.color = '#64748b';
            info.style.margin = '0 0 0.5rem 0';
            wrap.appendChild(info);

            const listContainer = document.createElement('div');
            listContainer.style.display = 'flex';
            listContainer.style.flexDirection = 'column';
            listContainer.style.gap = '0.5rem';

            // Всегда сортируем каталог по алфавиту перед выводом
            userCatalog.sort((a, b) => a.name.localeCompare(b.name, 'ru'));

            userCatalog.forEach((catalogItem, index) => {
                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.alignItems = 'center';
                item.style.justifyContent = 'space-between';
                item.style.backgroundColor = '#ffffff';
                item.style.border = '1px solid #e2e8f0';
                item.style.padding = '0.5rem 0.75rem';
                item.style.borderRadius = '0.5rem';
                item.style.gap = '0.5rem';

                item.innerHTML = `
                    <input type="text" value="${catalogItem.emoji}" oninput="validateAndChangeEmoji(${index}, this)" style="width: 2.2rem; height: 2.2rem; text-align: center; font-size: 1.25rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; background: #ffffff; padding: 0; box-sizing: border-box; flex-shrink: 0; cursor: pointer;">
                    <input type="text" value="${catalogItem.name}" onchange="globalRenameCatalogItem(${index}, this.value)" style="border: 1px solid #cbd5e1; padding: 0.35rem 0.5rem; font-size: 0.875rem; border-radius: 0.375rem; flex-grow: 1; background: #f8fafc; font-weight: 500; min-width: 0; color: #334155;">
                    
                    <!-- Новое компактное поле для настройки дней по умолчанию -->
                    <div style="display: flex; align-items: center; gap: 0.15rem; flex-shrink: 0;">
                        <input type="number" value="${catalogItem.defaultDays || 5}" min="0" onchange="globalChangeCatalogDays(${index}, this.value)" style="width: 2.5rem; border: 1px solid #cbd5e1; padding: 0.35rem 0.25rem; font-size: 0.8rem; border-radius: 0.375rem; text-align: center; font-weight: 600; color: #475569; background: #ffffff;">
                        <span style="font-size: 0.7rem; color: #94a3b8; font-weight: 600;">дн</span>
                    </div>

                    <button onclick="globalDeleteCatalogItem(${index})" style="background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer; font-size: 1.1rem; padding: 0.25rem 0.5rem;">✕</button>
                `;
                listContainer.appendChild(item);
            });

            wrap.appendChild(listContainer);
            container.appendChild(wrap);

            // Добавляем аварийную кнопку сброса данных в самый низ Профиля
            const resetBtnContainer = document.createElement('div');
            resetBtnContainer.style.cssText = "margin-top: 2rem; padding: 0 1rem; text-align: center;";
            resetBtnContainer.innerHTML = `
                <button onclick="emergencyAppReset()" style="background-color: #ef4444; color: #ffffff; border: none; padding: 0.6rem 1.2rem; font-size: 0.85rem; font-weight: 700; border-radius: 0.5rem; cursor: pointer; box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2); transition: background 0.2s;" onmouseover="this.style.backgroundColor='#dc2626'" onmouseout="this.style.backgroundColor='#ef4444'">
                    🚨 Сбросить приложение по умолчанию
                </button>
            `;
            container.appendChild(resetBtnContainer);
        }

        // ВАЛИДАЦИЯ И ОБНОВЛЕНИЕ ЭМОДЗИ В РЕАЛЬНОМ ВРЕМЕНИ
        function validateAndChangeEmoji(index, inputElement) {
            let rawValue = inputElement.value.trim();
            if (!rawValue) return;

            // Защита от вставки длинного текста: используем итератор, чтобы корректно отрезать ровно ОДИН эмодзи/символ
            const chars = Array.from(rawValue);
            const singleChar = chars[0]; 

            // Обновляем данные в нашей глобальной базе Профиля
            userCatalog[index].emoji = singleChar;
            localStorage.setItem('user_products_catalog', JSON.stringify(userCatalog));
            
            // Насильно возвращаем в инпут только один чистый символ, стирая остальной спам
            inputElement.value = singleChar;
        }

        function globalChangeCatalogDays(index, value) {
            let days = parseInt(value);
            if (isNaN(days) || days < 0) days = 5;
            
            userCatalog[index].defaultDays = days;
            localStorage.setItem('user_products_catalog', JSON.stringify(userCatalog));
            render();
        }

        // ГЛОБАЛЬНОЕ ПЕРЕИМЕНОВАНИЕ ВО ВСЕМ ПРИЛОЖЕНИИ
        function globalRenameCatalogItem(index, inputVal) {
            let rawNewName = inputVal.trim();
            if (!rawNewName) return render();
            
            const newName = rawNewName.charAt(0).toUpperCase() + rawNewName.slice(1);
            const oldName = userCatalog[index];

            if (oldName === newName) return;

            // 1. Меняем имя в самом каталоге
            userCatalog[index] = newName;

            // 2. Сквозное обновление на полках холодильника
            products.forEach(p => {
                if (p.name.toLowerCase().trim() === oldName.toLowerCase().trim()) {
                    p.name = newName;
                }
            });

            // 3. Сквозное обновление во всей Книге рецептов
            recipesDatabase.forEach(recipe => {
                recipe.ingredients.forEach(ing => {
                    if (ing.name.toLowerCase().trim() === oldName.toLowerCase().trim()) {
                        ing.name = newName;
                    }
                });
            });

            // Сохраняем все обновленные базы в память устройства
            localStorage.setItem('user_products_catalog', JSON.stringify(userCatalog));
            localStorage.setItem('my_fridge_items', JSON.stringify(products));
            localStorage.setItem('my_custom_recipes', JSON.stringify(recipesDatabase));

            render();
        }

        // УДАЛЕНИЕ ИЗ СПРАВОЧНИКА
        function globalDeleteCatalogItem(index) {
            const nameToDelete = userCatalog[index];
            if (!confirm(`Вы действительно хотите удалить "${nameToDelete}" из глобального справочника? Это уберет товар только из подсказок автозаполнения, продукты на полках останутся.`)) return;

            userCatalog.splice(index, 1);
            localStorage.setItem('user_products_catalog', JSON.stringify(userCatalog));
            render();
        }

        // АВТОМАТИЧЕСКИЙ ЛЕКАРЬ БАЗЫ: Исправляем старые аномальные минусы (-20700 дней) у пользователя
        if (products && products.length > 0) {
            let isDatabaseFixed = false;
            
            products.forEach(item => {
                // Если у продукта аномальный срок (меньше года в минусе) или слетела дата создания
                if (item.daysLeft < -365 || !item.createdAt || item.createdAt < 100000) {
                    item.createdAt = Date.now();
                    item.initialDays = item.daysLeft > 0 ? item.daysLeft : 5; // Даем дефолтные 5 дней, если срок был сломан
                    item.daysLeft = item.initialDays;
                    isDatabaseFixed = true;
                }
            });
            
            if (isDatabaseFixed) {
                localStorage.setItem('my_fridge_items', JSON.stringify(products));
            }
        }

        // АНИМАЦИЯ ПЛЕЙСХОЛДЕРОВ: Массивы сменяющихся подсказок
        const foodPlaceholders = ['Молоко', 'Сыр', 'Томаты', 'Яйца', 'Соус', 'Огурец', 'Хлеб', 'Рыба', 'Йогурт', 'Масло'];
        const recipePlaceholders = ['Яичница с томатами', 'Классический омлет', 'Свежий салат', 'Бутерброд с сыром', 'Грибной суп'];
        
        let currentPlaceholderIdx = 0;

        function animatePlaceholdersLoop() {
            currentPlaceholderIdx = (currentPlaceholderIdx + 1) % foodPlaceholders.length;
            
            const prodInput = document.getElementById('prodName');
            const recInput = document.getElementById('recName');
            
            // Динамически меняем плейсхолдеры, если элементы есть на странице
            if (prodInput) {
                prodInput.placeholder = foodPlaceholders[currentPlaceholderIdx];
            }
            if (recInput) {
                recInput.placeholder = recipePlaceholders[currentPlaceholderIdx % recipePlaceholders.length];
            }
        }

        // Запускаем автоматическую смену каждые 2.5 секунды (2500 мс)
        setInterval(animatePlaceholdersLoop, 2500);

        // МОДУЛЬ DRAG & DROP: Перетаскивание продуктов на ПК и мобильных телефонах
        let draggedElementId = null;

        // 1. Обработка для ПК (HTML5 Drag and Drop)
        function onDragStart(event, productId) {
            draggedElementId = productId;
            event.dataTransfer.setData('text/plain', productId);
            // Добавляем легкую прозрачность карточке при старте переноса
            setTimeout(() => event.target.style.opacity = '0.4', 0);
        }

        function onDragEnd(event) {
            event.target.style.opacity = '1';
            draggedElementId = null;
        }

        function onDragOver(event) {
            event.preventDefault(); // Обязательно разрешаем сброс на эту зону
        }

        function onDragEnter(event) {
            event.preventDefault();
            const shelfBorder = event.target.closest('.shelf-border');
            if (shelfBorder) shelfBorder.classList.add('shelf-hover');
        }

        function onDragLeave(event) {
            const shelfBorder = event.target.closest('.shelf-border');
            if (shelfBorder) shelfBorder.classList.remove('shelf-hover');
        }

        function onDrop(event, targetShelfName) {
            event.preventDefault();
            const shelfBorder = event.target.closest('.shelf-border');
            if (shelfBorder) shelfBorder.classList.remove('shelf-hover');

            const productId = event.dataTransfer.getData('text/plain') || draggedElementId;
            if (!productId) return;

            executeProductMove(productId, targetShelfName);
        }

        // 2. Обработка для мобильных телефонов (Touch Events)
        let touchDraggedCard = null;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoveX = 0;
        let touchMoveY = 0;
        let isRealDrag = false; // Флаг: перенос это или просто быстрый тап
        let draggedElementId = null;

        function onTouchStart(event, productId) {
            const card = event.target.closest('.product-card');
            if (!card) return;

            touchDraggedCard = card;
            draggedElementId = productId;
            isRealDrag = false;

            const touch = event.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }

        function onTouchMove(event) {
            if (!touchDraggedCard) return;

            const touch = event.touches[0];
            touchMoveX = touch.clientX;
            touchMoveY = touch.clientY;

            const deltaX = touchMoveX - touchStartX;
            const deltaY = touchMoveY - touchStartY;

            // Если сдвиг больше 5 пикселей — включаем режим реального перетаскивания
            if (!isRealDrag && (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5)) {
                isRealDrag = true;
                touchDraggedCard.style.zIndex = '1000';
                touchDraggedCard.style.pointerEvents = 'none'; // Чтобы видеть элементы под пальцем
            }

            if (isRealDrag) {
                // Включаем аппаратное ускорение видеокарты смартфона (translate3d) — карточка летает за пальцем!
                touchDraggedCard.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0)`;

                // Подсвечиваем полку под пальцем
                const elementUnderFinger = document.elementFromPoint(touchMoveX, touchMoveY);
                const activeShelf = elementUnderFinger ? elementUnderFinger.closest('.shelf-border') : null;

                document.querySelectorAll('.shelf-border').forEach(s => s.classList.remove('shelf-hover'));
                if (activeShelf) activeShelf.classList.add('shelf-hover');
            }
        }

        function onTouchEnd(event) {
            if (!touchDraggedCard) return;

            document.querySelectorAll('.shelf-border').forEach(s => s.classList.remove('shelf-hover'));

            // Сбрасываем аппаратные стили
            touchDraggedCard.style.zIndex = '';
            touchDraggedCard.style.pointerEvents = '';
            touchDraggedCard.style.transform = '';

            // КЛИК ДЛЯ ТЕЛЕФОНА: Если палец почти не сдвинулся — открываем модалку!
            if (!isRealDrag && draggedElementId) {
                openProductDetailsModal(draggedElementId);
            } else if (isRealDrag && draggedElementId) {
                // Если это был осознанный перенос, определяем финальную полку
                const dropTarget = document.elementFromPoint(touchMoveX, touchMoveY);
                const targetShelfElement = dropTarget ? dropTarget.closest('.shelf-border') : null;

                if (targetShelfElement) {
                    const targetShelfName = targetShelfElement.getAttribute('data-shelf');
                    executeProductMove(draggedElementId, targetShelfName);
                } else {
                    render();
                }
            }

            touchDraggedCard = null;
            draggedElementId = null;
            isRealDrag = false;
        }

        // 3. Главная функция перезаписи полки в базе данных
        function executeProductMove(productId, targetShelfName) {
            if (!targetShelfName) return;

            // Принудительно приводим оба ID к строке и очищаем от пробелов, чтобы типы данных (число/строка) не конфликтовали
            const productIndex = products.findIndex(p => String(p.id).trim() === String(productId).trim());
            
            if (productIndex === -1) {
                console.error("Критическая ошибка: не удалось найти продукт с ID:", productId);
                return;
            }

            // Если продукт действительно перенесли на ДРУГУЮ полку — сохраняем шаг в Историю
            if (products[productIndex].shelf !== targetShelfName) {
                saveState(); // Запоминаем для кнопки Назад (Undo)
                
                products[productIndex].shelf = targetShelfName;
                localStorage.setItem('my_fridge_items', JSON.stringify(products));
                console.log("Продукт успешно перенесен на полку: " + targetShelfName);
            }
            
            render();
        }
        
        // ЭТАП 2: Сжатие фотографии и перевод в текстовый формат Base64
        function handleCameraFile(inputElement) {
            if (!inputElement.files || inputElement.files.length === 0) return;
            
            const file = inputElement.files[0];
            
            // Открываем модальное окно ожидания ИИ
            const aiModal = document.getElementById('aiLoadingModal');
            if (aiModal) aiModal.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Создаем виртуальный холст для сжатия
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    // Рассчитываем пропорциональное уменьшение сторон
                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;

                    // Отрисовываем уменьшенную картинку на холсте
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Сжимаем качество до 70% и получаем чистую строку Base64
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    // Отсекаем технический заголовок "data:image/jpeg;base64,", оставляя только тело строки для ИИ
                    const base64Data = dataUrl.split(',')[1];

                    console.log("Фото успешно сжато! Размер в Base64:", base64Data.length, "символов.");

                    // ПЕРЕХОД К ЭТАПУ 3: Передаем чистую Base64-строку в функцию запроса к OpenRouter
                    sendImageToGemini(base64Data);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ЭТАП 3: Отправка фото на собственный сервер Serverless Vercel API
        async function sendImageToGemini(base64ImageText) {
            const aiModal = document.getElementById('aiLoadingModal');
            
            try {
                // Умная пересылка: если мы на GitHub Pages, отправляем фото на бэкенд Vercel, иначе шлём по относительному пути
                const apiUrl = window.location.hostname.includes('github.io') ? 'https://vercel.app' : '/api/scan';
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64ImageText }) // Передаем картинку в теле запроса
                });

                if (!response.ok) {
                    // Вычитываем JSON-ошибку, которую нам прислал сервер Vercel
                    const errData = await response.json().catch(() => ({}));
                    
                    // Создаем умный объект ошибки и прикрепляем к нему скрытые детали с сервера
                    const serverError = new Error(errData.error || 'Ошибка бэкенда Vercel');
                    if (errData.details) {
                        serverError.details = errData.details;
                    }
                    throw serverError;
                }

                // Получаем чистый готовый массив продуктов от нашего сервера
                const recognizedItems = await response.json();
                console.log("Продукты успешно получены от Vercel API:", recognizedItems);

                if (Array.isArray(recognizedItems) && recognizedItems.length > 0) {
                    saveState(); // Сохраняем слепок в Историю (Undo)

                    const now = Date.now();

                    recognizedItems.forEach(aiProd => {
                        if (!aiProd.name || !aiProd.shelf) return;

                        const cleanName = aiProd.name.charAt(0).toUpperCase() + aiProd.name.slice(1).trim();
                        const qty = parseInt(aiProd.qty) || 1;

                        addToCatalog(cleanName);

                        let defaultDays = 5;
                        const catalogItem = userCatalog.find(c => c.name.toLowerCase().trim() === cleanName.toLowerCase().trim());
                        if (catalogItem && catalogItem.defaultDays !== undefined) {
                            defaultDays = catalogItem.defaultDays;
                        }

                        const existing = products.find(p => 
                            p.name.toLowerCase().trim() === cleanName.toLowerCase().trim() && 
                            p.shelf === aiProd.shelf &&
                            p.daysLeft === defaultDays
                        );

                        if (existing) {
                            existing.qty += qty;
                        } else {
                            products.push({
                                id: now + Math.random(),
                                name: cleanName,
                                qty: qty,
                                shelf: aiProd.shelf,
                                initialDays: defaultDays,
                                daysLeft: defaultDays,
                                createdAt: now
                            });
                        }
                    });

                    localStorage.setItem('my_fridge_items', JSON.stringify(products));
                    alert("✨ Успех! Настоящий ИИ успешно распознал и разложил по полкам продуктов: " + recognizedItems.length + " шт.");
                } else {
                    alert("ℹ️ ИИ не смог чётко разглядеть продукты на снимке. Попробуйте сделать другое фото при хорошем освещении.");
                }

            } catch (error) {
                console.error("Критический сбой ИИ-модуля Vercel:", error);
                // Проверяем, передал ли нам сервер подробные детали ошибки
                let displayError = error.message;
                if (error.details) {
                    displayError += "\nДетали: " + error.details;
                }
                alert("⚠️ " + displayError);
            } finally {
                if (aiModal) aiModal.classList.add('hidden');
                const camInp = document.getElementById('cameraInput');
                if (camInp) camInp.value = '';
                render();
            }
        }

        // Функция полной экстренной очистки данных приложения
        function emergencyAppReset() {
            if (confirm("Вы уверены, что хотите полностью сбросить приложение? Все добавленные продукты, кастомные сроки годности и история будут безвозвратно удалены, а база вернется к начальному состоянию.")) {
                localStorage.clear(); // Стираем всю локальную память браузера
                window.location.reload(); // Перезагружаем страницу с чистыми заводскими настройками
            }
        }

        // Самая финальная инициализация всего приложения при старте страницы
        render();

    </script>
